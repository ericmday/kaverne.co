<!doctype html>
<title>Kaverne · connect</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A0A0A">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&display=swap">
<style>
/* exploration, one clear version: tell the night shift what you're making; the agents talk it through,
   ask one question, then show real first drafts and keep going while you watch. */
:root{
  color-scheme:dark;
  --bg:#0A0A0A; --text:#B8B8B8; --hi:#E6E6E6; --chrome:#5E5E5E; --faint:#3A3A3A; --ember:#E07A34;
  --mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --fs:clamp(12.5px,1.12vw,18px); --lh:1.7;
  --m:clamp(20px,8vw,120px);
}
*{box-sizing:border-box}
html,body{height:100%}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:400 var(--fs)/var(--lh) var(--mono);-webkit-text-size-adjust:100%;font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0;overflow:hidden}
.scr{position:relative;height:100%;min-height:440px;overflow:hidden}
.top,.bot{position:absolute;left:var(--m);right:var(--m);display:flex;justify-content:space-between;gap:16px;font-size:.78em;line-height:1.4}
.top{top:calc(var(--m) * .55)}
.bot{bottom:calc(var(--m) * .55)}
.mark{color:var(--chrome)}
.what{display:block;color:var(--text);margin-top:.5em}
.count{color:var(--faint);font-variant-numeric:tabular-nums;text-align:right}
.mail{color:var(--chrome);text-decoration:none;transition:color .4s}
.mail:hover,.mail:focus-visible{color:var(--hi);outline:none}

.feed{position:absolute;left:var(--m);right:var(--m);top:calc(var(--m) * 1.2);bottom:calc(var(--m) * .55 + 4.2em);overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 22%);mask-image:linear-gradient(to bottom,transparent 0,#000 22%)}
.row{display:grid;grid-template-columns:6ch 14ch minmax(0,1fr);column-gap:2ch;white-space:pre-wrap}
.row .t{color:var(--chrome);font-variant-numeric:tabular-nums}
.row .c{color:var(--chrome);overflow:hidden;white-space:nowrap}
.row.world .x,.row.world .c,.row.world .t{color:var(--faint)}
.row.ours .c,.row.ours .x{color:var(--hi)}
.row.job .c{color:var(--hi)}
.row.job .x{color:var(--text)}
.row.you .c{color:var(--ember)}
.row.you .x{color:var(--text)}
.row.sys .x{color:var(--chrome)}
.row.intro .x{color:var(--text)}
.cur{display:inline-block;width:.6em;height:1.1em;vertical-align:-.2em;background:var(--chrome);margin-left:1px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* the drafts: drawn plainly, so you can see what they made */
.row.work{margin:.5em 0 .9em}
.row.work .x{white-space:normal}
.draft{display:flex;flex-wrap:wrap;gap:1.6em 2.2em;align-items:flex-end;opacity:0;transform:translateY(6px);transition:opacity 1.2s ease,transform 1.2s ease}
.draft.in{opacity:1;transform:none}
.draft figure{margin:0;display:flex;flex-direction:column;align-items:flex-start;gap:.5em}
.draft figcaption{font-size:.78em;color:var(--chrome)}
.draft svg{display:block;stroke:var(--hi);fill:none;stroke-width:1.4}
.draft svg .f{fill:var(--hi);stroke:none}
.draft svg text{fill:var(--hi);stroke:none}
.draft .sw{display:block;width:4.2em;height:3em;border-radius:2px}
.draft .spec{display:block;color:var(--hi);white-space:nowrap}
.draft .spec.a{font:italic 400 2em/1.1 Georgia,"Times New Roman",serif}
.draft .spec.b{font:700 1.3em/1.4 "Helvetica Neue",Arial,sans-serif;text-transform:uppercase;letter-spacing:.2em}
.draft .spec.c{font:400 1.1em/1.6 var(--mono);color:var(--text);letter-spacing:.35em}
.draft.big svg{stroke-width:1.6}

/* the line you type on */
.line{position:absolute;left:var(--m);right:var(--m);bottom:calc(var(--m) * .55 + 1.9em);display:grid;grid-template-columns:6ch 14ch minmax(0,1fr);column-gap:2ch;align-items:baseline}
.line .t{color:var(--chrome);font-variant-numeric:tabular-nums}
.line .c{color:var(--ember)}
.line input,.line button{all:unset;font:inherit;color:var(--hi);caret-color:var(--ember);width:100%}
.line button{color:var(--hi);cursor:pointer;width:auto;border-bottom:1px solid var(--faint);transition:border-color .4s}
.line button:hover,.line button:focus-visible{border-color:var(--ember)}
.line input::placeholder{color:var(--chrome)}
.line.off{visibility:hidden}

@media (max-width:640px){
  .row,.line{grid-template-columns:5ch 9ch minmax(0,1fr);column-gap:1.4ch}
  .row .c .r{display:block}.here{display:none}
  .feed{top:calc(var(--m) * .55 + 7em);bottom:calc(var(--m) * .55 + 5.6em)}
  .line{bottom:calc(var(--m) * .55 + 3.2em)}
  .row.work .x{grid-column:1/-1}
  .draft{gap:1.2em 1.4em;font-size:.9em}
}
@media (prefers-reduced-motion:reduce){.cur{animation:none}.draft{transition:none;opacity:1;transform:none}}
</style>

<main class="scr">
  <div class="top"><span class="mark">kaverne &nbsp;&middot;&nbsp; night shift<span class="what">an agentic creative studio. people by day, agents by night.</span></span><span class="count" id="count"></span></div>
  <div class="feed" id="feed" role="log" aria-live="polite" aria-label="the night shift"></div>
  <form class="line" id="line" autocomplete="off">
    <span class="t" id="lt"></span><span class="c">you</span>
    <span id="slot"><button type="button" id="go">connect to the night shift ›</button></span>
  </form>
  <div class="bot"><span class="mark">a demo. nothing you type leaves this page.</span><a class="mail" href="mailto:hello@kaverne.co">hello@kaverne.co</a></div>
</main>

<script>
(function(){
var TZ='America/Los_Angeles',RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
var $=function(id){return document.getElementById(id);};
var feed=$('feed'),line=$('line'),slot=$('slot'),lt=$('lt'),count=$('count');
var fmt={};function local(tz,sec){var k=tz+(sec?'s':'');var f=fmt[k]||(fmt[k]=new Intl.DateTimeFormat('en-GB',{timeZone:tz,hour:'2-digit',minute:'2-digit',second:sec?'2-digit':undefined,hourCycle:'h23'}));var p={};f.formatToParts(new Date()).forEach(function(x){p[x.type]=x.value;});return {h:+p.hour,s:p.hour+':'+p.minute+(sec?':'+p.second:'')};}
function rnd(a){return a[(Math.random()*a.length)|0];}

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function tick(){count.innerHTML=local(TZ,true).s+'<span class="here"> in los angeles</span>';lt.textContent=local(TZ).s;}
setInterval(tick,1000);tick();

/* ---------- rows ---------- */
function row(cls,time,who){var r=document.createElement('div');r.className='row'+(cls?' '+cls:'');
  var a=document.createElement('span');a.className='t';a.textContent=time;
  var b=document.createElement('span');b.className='c';var sl=who.indexOf('/');b.textContent=sl<0?who:who.slice(0,sl);if(sl>=0){var q=document.createElement('span');q.className='r';q.textContent=who.slice(sl);b.appendChild(q);}
  var x=document.createElement('span');x.className='x';r.appendChild(a);r.appendChild(b);r.appendChild(x);feed.appendChild(r);
  while(feed.children.length>40)feed.removeChild(feed.firstChild);return x;}
function type(el,text,cps){return new Promise(function(res){if(RM){el.textContent=text;res();return;}var cur=document.createElement('span');cur.className='cur';el.appendChild(cur);var i=0;
  (function step(){if(i>=text.length){cur.remove();res();return;}el.insertBefore(document.createTextNode(text[i++]),cur);setTimeout(step,1000/cps*(0.6+Math.random()*0.8));})();});}
async function say(cls,who,text,cps){var x=row(cls,local(TZ).s,who);await type(x,text,cps||18);await wait(450+Math.random()*600);}
async function show(html,big){var x=row('work','','');var d=document.createElement('div');d.className='draft'+(big?' big':'');d.innerHTML=html;x.appendChild(d);
  requestAnimationFrame(function(){requestAnimationFrame(function(){d.classList.add('in');});});await wait(1600);}

/* ---------- the world's night, faint and slow, behind the conversation ---------- */
var CITIES=[['tokyo','Asia/Tokyo'],['seoul','Asia/Seoul'],['sydney','Australia/Sydney'],['auckland','Pacific/Auckland'],['manila','Asia/Manila'],['mumbai','Asia/Kolkata'],['dubai','Asia/Dubai'],['nairobi','Africa/Nairobi'],['lisbon','Europe/Lisbon'],['reykjavik','Atlantic/Reykjavik'],['new york','America/New_York'],['chicago','America/Chicago'],['honolulu','Pacific/Honolulu'],['anchorage','America/Anchorage'],['são paulo','America/Sao_Paulo'],['lagos','Africa/Lagos']];
var NIGHT=['a backup completes. it always does.','a tsunami buoy reports nothing. that’s the good news.','a lighthouse foghorn stays quiet. clear night.','a seed vault in the arctic checks its temperature. cold enough.','a bakery’s ovens preheat themselves at three.','a crossword is checked. seventeen across was wrong.','a drone counts a flock of sheep and gets the same number twice.','a satellite reboots itself above the pacific.','a podcast is cleaned of every “um”.','a canal lock fills for a boat due at dawn.','a cleaning robot finds a stuffed rabbit and goes around it.','a weather balloon is let go at midnight, on schedule.','a painting is x-rayed. there’s another painting underneath.','a night bus runs empty for one stop.','a menu is translated. the jokes don’t make it.'];
var used=[];function night(){var c=NIGHT.filter(function(x){return used.indexOf(x)<0;});if(!c.length){used=[];c=NIGHT;}var x=rnd(c);used.push(x);return x;}
function dark(){return CITIES.filter(function(c){var h=local(c[1]).h;return h>=22||h<6;});}
var connected=false,busy=false;
async function world(){for(;;){
  await wait(connected?14000+Math.random()*10000:2200+Math.random()*2000);
  if(busy)continue;var d=dark(),c=d.length?rnd(d):rnd(CITIES);var x=row(connected?'world':'',local(c[1]).s,c[0]);
  if(connected)x.textContent=night();else await type(x,night(),26);}}

/* ---------- reading what you said ---------- */
var STOP={a:1,an:1,the:1,for:1,of:1,to:1,and:1,that:1,which:1,only:1,at:1,in:1,on:1,my:1,our:1,new:1,about:1,with:1,is:1,it:1,we:1,i:1,some:1,this:1,just:1,really:1,very:1,like:1,want:1,need:1,make:1,making:1,something:1};
var KINDS=/^(logo|logos|brand|branding|identity|wordmark|mark|film|video|music|website|site|app|album|song|book|poster|posters|campaign|short|ad|record|cover|launch)$/;
function words(s){return s.toLowerCase().replace(/[^a-z0-9’'\s-]/g,' ').split(/\s+/).filter(function(w){return w&&!STOP[w];});}
function frag(s){s=s.trim().replace(/\s+/g,' ').replace(/[.!?]+$/,'').toLowerCase();var m=s.match(/\b(?:for|about|of) (.{6,})$/);if(m)s=m[1];var w=s.split(' ');return w.length>9?w.slice(0,9).join(' ')+'…':s;}
function subject(s){var m=s.toLowerCase().match(/\b(?:for|about|of) (.+)$/);var w=words(m?m[1]:s).filter(function(x){return !KINDS.test(x);});return (w[0]||'kaverne').replace(/[’']s$/,'');}
function initials(s){var w=words(s).filter(function(x){return /^[a-z]/.test(x)&&!KINDS.test(x);});return (w.length>1?w[0][0]+w[w.length-1][0]:(w[0]||'k').slice(0,2)).toUpperCase();}
var HUES={red:5,orange:25,amber:38,yellow:52,gold:45,green:125,olive:80,teal:175,cyan:188,blue:215,navy:225,indigo:245,purple:270,violet:265,lilac:280,pink:330,magenta:310,brown:28,rust:18,warm:24,cool:205};
function colourWish(s){s=(s||'').toLowerCase();var no=[],yes=[];Object.keys(HUES).forEach(function(c){if(new RegExp('(not|no|never|without|avoid|hate)\\s+(any\\s+)?'+c).test(s))no.push(c);else if(new RegExp('\\b'+c+'\\b').test(s))yes.push(c);});return {no:no,yes:yes};}
function hsl2hex(h,s,l){s/=100;l/=100;var k=function(n){return (n+h/30)%12;},a=s*Math.min(l,1-l),f=function(n){return l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));};return '#'+[f(0),f(8),f(4)].map(function(x){return Math.round(x*255).toString(16).padStart(2,'0');}).join('').toUpperCase();}
function near(h,c){return Math.abs(((h-HUES[c])%360+540)%360-180)<28;}
function palette(seed,wish){var h=hash(seed)%360,want=wish.yes.length?HUES[wish.yes[0]]:null;
  /* asked for a colour: the whole palette comes from it. otherwise: dark, mid, an accent across the wheel, a light */
  return (want!==null?[[want,30,13],[want+8,34,32],[want,62,55],[want-6,22,86]]:[[h,22,12],[h+18,26,30],[h+165,58,56],[h+8,16,86]]).map(function(p){var hh=(p[0]%360+360)%360;for(var g=0;g<12&&wish.no.some(function(c){return near(hh,c);});g++)hh=(hh+31)%360;return hsl2hex(hh,p[1],p[2]);});}

/* ---------- the drafts ---------- */
var DRAW={
  marks:function(sub,ini,pick){var a=esc(sub[0].toUpperCase()),w=esc(sub.slice(0,12));
    var m1='<svg width="88" height="88" viewBox="0 0 88 88"><circle cx="44" cy="44" r="38"/><text x="44" y="57" text-anchor="middle" font-family="Georgia,serif" font-size="38">'+a+'</text></svg>';
    var m2='<svg width="88" height="88" viewBox="0 0 88 88"><rect x="8" y="8" width="72" height="72"/><rect x="14" y="14" width="60" height="60" stroke-opacity=".4"/><text x="44" y="52" text-anchor="middle" font-family="Helvetica Neue,Arial,sans-serif" font-weight="700" font-size="22" letter-spacing="3">'+esc(ini)+'</text></svg>';
    var tw=Math.max(80,sub.length*13+12);
    var m3='<svg width="'+tw+'" height="88" viewBox="0 0 '+tw+' 88"><text x="0" y="50" font-family="Helvetica Neue,Arial,sans-serif" font-size="26" letter-spacing="-.5">'+w+'</text><circle class="f" cx="'+(sub.length*13+6)+'" cy="47" r="3.2"/><line x1="0" y1="62" x2="'+(tw-6)+'" y2="62" stroke-opacity=".5"/></svg>';
    var all=[m1,m2,m3];if(pick!==undefined)return '<figure>'+all[pick].replace(/width="(\d+)" height="88"/,function(_,w){return 'width="'+Math.round(w*1.8)+'" height="158"';})+'<figcaption>mark '+(pick+1)+', kept</figcaption></figure>';
    return all.map(function(m,i){return '<figure>'+m+'<figcaption>mark '+(i+1)+'</figcaption></figure>';}).join('');},
  type:function(sub){var s=esc(sub);return '<figure><span class="spec a">'+s+'</span><span class="spec b">'+s+'</span><span class="spec c">'+s+'</span><figcaption>serif · grotesk · mono</figcaption></figure>';},
  palette:function(cols){return cols.map(function(c){return '<figure><span class="sw" style="background:'+c+'"></span><figcaption>'+c+'</figcaption></figure>';}).join('');},
  frames:function(pick){var f=[
    '<svg width="132" height="76" viewBox="0 0 132 76"><rect x="1" y="1" width="130" height="74"/><line x1="1" y1="46" x2="131" y2="46" stroke-opacity=".6"/><circle class="f" cx="70" cy="56" r="2.6"/><line x1="70" y1="58" x2="70" y2="66"/></svg>',
    '<svg width="132" height="76" viewBox="0 0 132 76"><rect x="1" y="1" width="130" height="74"/><circle cx="66" cy="30" r="11"/><path d="M42 75 C46 52 86 52 90 75"/></svg>',
    '<svg width="132" height="76" viewBox="0 0 132 76"><rect x="1" y="1" width="130" height="74"/><rect x="74" y="54" width="44" height="6" class="f"/><circle class="f" cx="22" cy="20" r="3"/></svg>'];
    var cap=['1 · wide','2 · close','3 · the end'];
    if(pick!==undefined)return '<figure>'+f[pick].replace('width="132" height="76"','width="250" height="144"')+'<figcaption>frame '+cap[pick]+', kept</figcaption></figure>';
    return f.map(function(s,i){return '<figure>'+s+'<figcaption>'+cap[i]+'</figcaption></figure>';}).join('');},
  wave:function(seed){var h=hash(seed),bars='';for(var i=0;i<44;i++){var t=i/43,env=Math.sin(Math.PI*Math.min(1,t*1.3))*(t>.7?1:.5);h=Math.imul(h^(h>>>15),2246822507)>>>0;var v=Math.max(.06,env*(.55+(h%100)/220));bars+='<rect class="f" x="'+(i*6)+'" y="'+(60-56*v).toFixed(1)+'" width="3.4" height="'+(56*v).toFixed(1)+'"/>';}
    return '<figure><svg width="264" height="62" viewBox="0 0 264 62">'+bars+'</svg><figcaption>quiet, then not</figcaption></figure>';},
  page:function(sub){return '<figure><svg width="220" height="140" viewBox="0 0 220 140"><rect x="1" y="1" width="218" height="138"/><text x="14" y="24" font-family="Helvetica Neue,Arial,sans-serif" font-size="12" font-weight="700">'+esc(sub.slice(0,14))+'</text><line x1="150" y1="20" x2="205" y2="20" stroke-dasharray="10 6"/><rect class="f" x="14" y="46" width="130" height="18"/><line x1="14" y1="78" x2="110" y2="78" stroke-opacity=".6"/><line x1="14" y1="88" x2="96" y2="88" stroke-opacity=".6"/><rect x="14" y="104" width="56" height="18"/><text x="42" y="117" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="9">start</text></svg><figcaption>the first screen</figcaption></figure>';}
};

/* ---------- what each kind of project gets ---------- */
var DOMAINS=[
 {id:'logo',k:/logo|brand|identity|wordmark|\bmark\b/i,noun:'logo',
  first:function(f){return [['logo','→ type: “'+f+'”. sketching marks.'],['type','→ colour: it’ll want a typeface before a colour.']];},ask:['colour','→ you: is there a colour it can’t be?'],
  work:[['logo','→ you: three first marks.','marks'],['type','→ you: the name, three ways.','type'],['colour','→ you: a first palette.','palette']],
  job:{role:'logo',unit:'mark',max:40,pick:'marks'},keep:'→ you: forty marks. this is the one we’d keep.',
  notes:[['review','→ logo: 2 is clever. that’s the problem with it.'],['type','→ logo: opening up the counter in the a.'],['logo','→ review: the circle holds at 16 pixels.']]},
 {id:'film',k:/film|video|\bad\b|commercial|trailer|short|documentary|spot|reel/i,noun:'film',
  first:function(f){return [['boards','→ cut: “'+f+'”. first frames by morning.'],['sound','→ boards: what does it sound like with the picture off?']];},ask:['cut','→ you: how long does it get to be?'],
  work:[['boards','→ you: three first frames.','frames'],['colour','→ you: a first palette.','palette']],
  job:{role:'boards',unit:'frame',max:24,pick:'frames'},keep:'→ you: twenty-four frames. this is the film.',
  notes:[['cut','→ boards: frame 2 is the film. the others set it up.'],['sound','→ cut: room tone under the end.'],['review','→ everyone: shorter. it’s always shorter.']]},
 {id:'music',k:/song|album|music|track|record|band|\bep\b|single/i,noun:'record',
  first:function(f){return [['score','→ sound: “'+f+'”. listening first.'],['design','→ score: the cover has to work as a thumbnail.']];},ask:['score','→ you: what should it feel like at the end?'],
  work:[['score','→ you: the shape of it, before any notes.','wave'],['design','→ you: the title, three ways.','type'],['colour','→ you: colours for the cover.','palette']],
  job:{role:'score',unit:'bar',max:64},keep:'→ you: sixty-four bars. the quiet part is the song.',
  notes:[['score','→ sound: down a semitone. it sat too bright.'],['design','→ colour: the cover reads from across a room now.'],['review','→ score: took the drums out of verse two.']]},
 {id:'site',k:/site|website|\bapp\b|web|page|product|platform/i,noun:'site',
  first:function(f){return [['design','→ words: “'+f+'”. one idea per screen.'],['words','→ design: the button can’t say “submit”.']];},ask:['design','→ you: what should someone do in the first ten seconds?'],
  work:[['design','→ you: the first screen.','page'],['type','→ you: the name, three ways.','type'],['colour','→ you: a first palette.','palette']],
  job:{role:'design',unit:'screen',max:12},keep:'→ you: twelve screens. the first one does the work.',
  notes:[['words','→ design: the headline was nine words. it’s four.'],['colour','→ design: the link colour passes contrast now.'],['review','→ design: moved everything four pixels. you’d have felt it.']]},
 {id:'print',k:/poster|print|packaging|label|magazine|flyer|card|book|zine/i,noun:'poster',
  first:function(f){return [['design','→ colour: “'+f+'”. paper first, then everything else.'],['colour','→ design: the screen is rgb. the paper isn’t.']];},ask:['design','→ you: where will people see it?'],
  work:[['type','→ you: the headline, three ways.','type'],['colour','→ you: a first palette.','palette']],
  job:{role:'design',unit:'proof',max:8},keep:'→ you: eight proofs. the paper won.',
  notes:[['colour','→ design: rich black, so it doesn’t print grey.'],['type','→ design: that hairline won’t survive the paper.'],['review','→ design: the white space is doing the work.']]}
];
var DEFAULT={id:'any',noun:'idea',
  first:function(f){return [['look','→ boards: “'+f+'”. forty directions. most will be bad.'],['words','→ look: say it in one sentence first.']];},ask:['review','→ you: what would make you say “that’s it”?'],
  work:[['boards','→ you: three first directions.','frames'],['colour','→ you: a first palette.','palette']],
  job:{role:'look',unit:'direction',max:40,pick:'frames'},keep:'→ you: forty directions. this one stayed.',
  notes:[['look','→ review: one direction is strange. keeping it.'],['colour','→ look: warm highlights, cool shadows.'],['review','→ everyone: the safe one is in the folder too.']]};

/* ---------- the conversation ---------- */
var ANSWERS=[],D=null,SUB='',PAL=null;
function prompt(ph){slot.innerHTML='';var i=document.createElement('input');i.id='in';i.maxLength=200;i.placeholder=ph;i.setAttribute('aria-label',ph);slot.appendChild(i);line.classList.remove('off');i.focus({preventScroll:true});}
async function draw(kind){
  if(kind==='marks')await show(DRAW.marks(SUB,initials(ANSWERS[0])));
  if(kind==='type')await show(DRAW.type(SUB));
  if(kind==='palette')await show(DRAW.palette(PAL));
  if(kind==='frames')await show(DRAW.frames());
  if(kind==='wave')await show(DRAW.wave(ANSWERS.join(' ')));
  if(kind==='page')await show(DRAW.page(SUB));}

async function connect(){
  connected=true;busy=true;line.classList.add('off');
  [].forEach.call(feed.querySelectorAll('.row'),function(r){r.classList.add('world');});
  var h=local(TZ).h,night=(h>=22||h<6),agents=night?6+((Math.random()*5)|0):3+((Math.random()*3)|0);
  await say('you','you','connect',30);
  await say('sys','kaverne','it’s '+local(TZ).s+' in los angeles. '+agents+' agents are awake.',22);
  await say('ours','kaverne/review','→ you: what are you making?',15);
  busy=false;prompt('a logo, a film, a song, a site… a sentence is plenty');}

async function answer(text){
  busy=true;line.classList.add('off');
  await say('you','you',text,60);
  if(ANSWERS.length>=2){await later(text);busy=false;prompt('tell them more, or just watch');return;}
  ANSWERS.push(text);
  if(ANSWERS.length===1){
    D=DOMAINS.filter(function(d){return d.k.test(text);})[0]||DEFAULT;SUB=subject(text);
    var ls=D.first(frag(text));for(var i=0;i<ls.length;i++)await say('ours','kaverne/'+ls[i][0],ls[i][1],16);
    await say('ours','kaverne/'+D.ask[0],D.ask[1],16);
    busy=false;prompt('answer, or press enter to skip');return;}
  /* second answer: they show you first drafts */
  var wish=colourWish(ANSWERS.join(' '));PAL=palette(ANSWERS.join(' '),wish);
  if(text)await say('ours','kaverne/review','→ everyone: noted: “'+frag(text)+'”.',16);
  await say('sys','kaverne','they work on it for a while.',24);
  for(var w=0;w<D.work.length;w++){var it=D.work[w],note=it[1];
    if(it[2]==='palette'&&wish.no.length)note+=' no '+wish.no.join(', no ')+'.';
    if(it[2]==='palette'&&wish.yes.length)note+=' built around '+wish.yes[0]+'.';
    await say('ours','kaverne/'+it[0],note,17);await draw(it[2]);}
  await say('ours','kaverne/review','→ you: first drafts. rough on purpose. they’ll keep going.',16);
  busy=false;prompt('tell them more, or just watch');progress();}

/* anything you add after the drafts: colours get a new palette; everything else goes to someone on the crew */
async function later(text){if(!text)return;ANSWERS.push(text);var wish=colourWish(text);
  if(wish.yes.length||wish.no.length){PAL=palette(ANSWERS.join(' '),colourWish(ANSWERS.join(' ')));
    await say('ours','kaverne/colour','→ you: '+(wish.yes.length?'more '+wish.yes[0]+'. ':'')+(wish.no.length?'no '+wish.no.join(', no ')+'. ':'')+'here’s the palette again.',17);await draw('palette');return;}
  var r=rnd(D.work)[0];await say('ours','kaverne/'+r,rnd(['→ you: noted. trying it both ways.','→ you: good. that changes the first draft.','→ you: yes. it was missing that.','→ you: on it.']),17);}

/* while you watch: the job counts up, with a few notes, then the one they'd keep */
async function progress(){var j=D.job,steps=[0.15,0.3,0.48,0.66,0.84],ni=0;
  for(var s=0;s<steps.length;s++){await wait(RM?6000:13000+Math.random()*7000);while(busy)await wait(800);busy=true;
    var n=Math.max(2,Math.round(j.max*steps[s]));
    await say('job','kaverne/'+j.role,SUB+' '+D.noun+': '+j.unit+' '+n+' of '+j.max+'.',18);
    if(s%2===1&&ni<D.notes.length){var nt=D.notes[ni++];await say('ours','kaverne/'+nt[0],nt[1],17);}
    busy=false;}
  await wait(RM?5000:12000);while(busy)await wait(800);busy=true;
  await say('ours','kaverne/'+j.role,D.keep,15);
  if(j.pick==='marks')await show(DRAW.marks(SUB,initials(ANSWERS[0]),2),true);
  else if(j.pick==='frames')await show(DRAW.frames(1),true);
  await say('sys','kaverne','that’s the first pass. the line stays open.',22);
  busy=false;}

$('go').addEventListener('click',connect);
line.addEventListener('submit',function(e){e.preventDefault();var i=$('in');if(!i||busy)return;var v=i.value.trim();if(!v&&ANSWERS.length===0)return;i.value='';answer(v);});
document.addEventListener('keydown',function(e){if(!connected&&e.key==='Enter'&&!e.metaKey){e.preventDefault();connect();}});

/* open mid-night, then say what this is */
(async function seed(){for(var k=0;k<5;k++){var c=rnd(dark().length?dark():CITIES);row('',local(c[1]).s,c[0]).textContent=night();}
  busy=true;await wait(900);await say('intro','kaverne','tell the night shift what you’re making. a few agents will start on it while you watch.',30);busy=false;world();})();
})();
</script>
