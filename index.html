<!doctype html>
<title>Kaverne</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<meta property="og:title" content="Kaverne">
<meta property="og:description" content="Kaverne. A studio for film, image and AI.">
<meta name="description" content="Kaverne. A studio for film, image and AI.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&display=swap">
<style>
/* the boot lab splash: the v1 ASCII cave prints in, KAVERNE under it, lit softly by a fire just out of frame */
:root{
  color-scheme:dark;
  --bg:#0A0A0A; --chrome:#5E5E5E; --hi:#E6E6E6;
  --mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--chrome);font:400 12px/1.4 var(--mono);-webkit-text-size-adjust:100%;overflow:hidden}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.scr{position:fixed;inset:0;overflow:hidden;background:var(--bg);-webkit-tap-highlight-color:rgba(0,0,0,0)}
.scr canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
/* the fire itself stays out of frame; this is the light it throws up the wall */
.glow{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse 70% 55% at 50% 108%,rgba(224,122,52,.16),rgba(224,122,52,.05) 45%,rgba(224,122,52,0) 75%)}
.scr::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.14) 3px),radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 58%,rgba(0,0,0,.55) 100%)}
.mail{position:absolute;z-index:2;right:max(16px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));color:var(--chrome);text-decoration:none;letter-spacing:.04em;padding:6px 0;opacity:0;transition:opacity 1.6s ease,color .4s}
.mail.on{opacity:1}
.mail:hover,.mail:focus-visible{color:var(--hi)}
.mail:focus-visible{outline:1px solid #E07A34;outline-offset:3px}
@media (max-width:640px){.mail{right:auto;left:50%;transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.mail{transition:none}}
</style>

<main class="scr" id="scr">
  <h1 class="sr">Kaverne</h1>
  <p class="sr">A studio for film, image and AI. Write to hello@kaverne.co.</p>
  <canvas id="cv" aria-hidden="true"></canvas>
  <div class="glow" id="glow" aria-hidden="true"></div>
  <a class="mail" id="mail" href="mailto:hello@kaverne.co">hello@kaverne.co</a>
</main>

<script>
(function(){
'use strict';
var CAVE=["                                         .+#%####:", "                                       -*%@@@@@@@%", "                                  .::-#@@@@@@@@@@@*", "                                 -%@@@@@@@@@@@@@@@@*:", "                                #@@@@@@@@@@@@@@@@@@@@+", "                            ..:+@@@@@@@@@@@@@@@@@@@@@@+:", "                            +@@@@@@@@@@@@@@@@@@@@@@@@@@*", "                            +@@@@@@@@@@@@@@@@@@@@@@@@@@%", "                            #@@@@@@@@@@@@@@@@@@@@@@@@@@%", "                           +@@@@@@@@@@@@@@@@@@@@@@@@@@@@*.", "                          -@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@#%+", "                          +@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@*:", "                          *@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@#", "                          #@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@%.", "                          %@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@%.", "                          *@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@*", "                         .=@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@-", "                         :+@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@-", "                         :+@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@-", "                        .--%@@@@@@@@@@@@@@@@@@@@@@@@@@@@@+", "                        .=-=%@@@@@@@@@@@@@@@@@@@@@@@@@@@@+", "                        .----%@@@@@@@@@@@@@@@@@@@@@@@@@@@-", "                       .----+@@@@@@@@@@@@@@@@@@@@@@@@@@@*", "                      :-----#@@@@@@@@@@@@@@@@@@@@@@@@@%#+.", "                     :-----+@@@@@@@@@@@@@@@@@@@@@@@@@*=--:", "                     .----=@@@@@@@@@@@@@@@@@@@@@@@@@*-----", "                      :---*@@@@@@@@@@@@@@@@@@@@@@@@@=-----.", "                     .-----%@@@@@@@@@@@@@@@@@@@@@@*=------:", "                     .-----%@@@@@@@@@@@@@@@@@@@@@@=--------.", "                      ----=@@%%%@@@@@@@@@@@@@@@@@#--------=:", "                      .:---=+=-==*@@@@@@@@@@@@@@*----------.", "                        ----------*@@@@@@@@@@@@@=--------.", "                        -----------*@@@@@@@@@@@#---------", "                        :-----------*@@@@@@@@@@#-------=.", "                         :=----------+#@@@@@@@%=------:.", "                         .----=====----=*#%%**=------:", "                           :::::::::-----===--=====:", "                               .::-=*%@%****######-", "                         ..:::------=++**++=:...", "           ....     .:--=++=++++**%%%%#####+-.", "        ......    .::--==+#%@@@@@@#####*++-.", "             --=======---=**#*+::::.......  ....", "             .:-==+++++++++++++=**==========:...", "       :------:::-----=============-:    .::...", "        ..:::--------=====+++====-----::", "             .....:::::::::::::::.......", "                :*#%%##*+++=+++****+-::..", " ...:::------------==+++-----------::::::--:::::...", "                     ..:::::::--==++*****++++======--.", "                         .................:::::::.....::.", "            .:::::---------:---=++*******+++==---::::....", "                                                        ...", " ............:::::::...     .:--======++***####**++===-:::.", " ...::::---------------:.      ..:-====--::.............", "                              ..    ...::--==++++++==-:.", "       ....................  .::--=======--::..", "        .........:::.......                ..::-----::...", "                        --=++++++++++********+==--:::.....", "                               .........", "     ...::::::::::::::::             .....:::::::::::::.", "                            .:::-===+====---:::::::...."];
var RMQ=matchMedia('(prefers-reduced-motion: reduce)'),RM=RMQ.matches;
var DPR=Math.min(2,window.devicePixelRatio||1);
var MONO='"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace';
var RAMP=' .:-=+*#%@'.split(''),NB=24;
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,k){return a+(b-a)*k;}
function sstep(a,b,v){var k=clamp((v-a)/(b-a),0,1);return k*k*(3-2*k);}
function h2(x,y,s){var n=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul(s|0,1442695041))|0;n=Math.imul(n^(n>>>13),1274126177);n^=n>>>16;return (n>>>0)/4294967296;}
function vn2(x,y,s){var xi=Math.floor(x),yi=Math.floor(y),fx=x-xi,fy=y-yi,ux=fx*fx*(3-2*fx),uy=fy*fy*(3-2*fy);
  var a=h2(xi,yi,s),b=h2(xi+1,yi,s),c=h2(xi,yi+1,s),d=h2(xi+1,yi+1,s);return (a*(1-ux)+b*ux)*(1-uy)+(c*(1-ux)+d*ux)*uy;}
function rgb(a){return 'rgb('+(a[0]|0)+','+(a[1]|0)+','+(a[2]|0)+')';}
function pal3(a,b,c){var o=[];for(var i=0;i<NB;i++){var k=i/(NB-1),x,y,t;if(k<0.5){x=a;y=b;t=k*2;}else{x=b;y=c;t=(k-0.5)*2;}o.push(rgb([lerp(x[0],y[0],t),lerp(x[1],y[1],t),lerp(x[2],y[2],t)]));}return o;}
function mixP(p,q,k){return p.map(function(c,i){var A=c.match(/\d+/g).map(Number),B=q[i].match(/\d+/g).map(Number);return rgb([lerp(A[0],B[0],k),lerp(A[1],B[1],k),lerp(A[2],B[2],k)]);});}
var P_WHITE=pal3([30,30,30],[128,128,128],[232,232,232]),P_WARM=pal3([40,26,18],[178,120,76],[255,236,212]);
/* 0 white, 1-3 white->warm (firelight), 4 ember */
var PALS=[P_WHITE,mixP(P_WHITE,P_WARM,0.33),mixP(P_WHITE,P_WARM,0.66),P_WARM,pal3([48,24,12],[190,118,60],[255,236,206])];
var RAMPI={};RAMP.forEach(function(c,i){RAMPI[c]=i;});

/* ---------- renderer (boot lab) ---------- */
function mkGrid(W,H,cols){var cw=W/cols,rows=Math.max(10,Math.round(H/(cw*1.85))),ch=H/rows,n=cols*rows;
  return {cols:cols,rows:rows,cw:cw,ch:ch,fs:Math.min(cw*1.68,ch*0.98),n:n,lum:new Float32Array(n),pi:new Uint8Array(n),chr:new Array(n),key:new Int32Array(n),ord:new Int32Array(n),cnt:new Int32Array(PALS.length*NB+1)};}
function drawCells(ctx,G,bg,thr){var n=G.n,K=PALS.length*NB,cnt=G.cnt,ord=G.ord,key=G.key,lum=G.lum,pi=G.pi,cols=G.cols,cw=G.cw,ch=G.ch;
  ctx.fillStyle=bg;ctx.fillRect(0,0,ctx.canvas.width,ctx.canvas.height);cnt.fill(0);
  for(var i=0;i<n;i++){var l=lum[i];if(l<thr){key[i]=-1;continue;}if(l>1)l=1;var k=pi[i]*NB+Math.min(NB-1,(l*(NB-1)+0.5)|0);key[i]=k;cnt[k+1]++;}
  for(var b=0;b<K;b++)cnt[b+1]+=cnt[b];var pos=cnt.slice(0,K);for(var j=0;j<n;j++)if(key[j]>=0)ord[pos[key[j]]++]=j;
  ctx.font=G.fs.toFixed(2)+'px '+MONO;ctx.textAlign='center';ctx.textBaseline='middle';var yo=ch*0.5+G.fs*0.04;
  for(var kk=0;kk<K;kk++){var s=cnt[kk],e=cnt[kk+1];if(s===e)continue;ctx.fillStyle=PALS[(kk/NB)|0][kk%NB];for(var m=s;m<e;m++){var id=ord[m];ctx.fillText(G.chr[id],(id%cols+0.5)*cw,((id/cols)|0)*ch+yo);}}}
var GCV=document.createElement('canvas'),GX=GCV.getContext('2d');
function glow(ctx,amt){if(!amt)return;var cv=ctx.canvas,w=Math.max(2,(cv.width/6)|0),h=Math.max(2,(cv.height/6)|0);if(GCV.width!==w||GCV.height!==h){GCV.width=w;GCV.height=h;}
  GX.globalCompositeOperation='copy';GX.imageSmoothingQuality='high';GX.drawImage(cv,0,0,w,h);ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=amt;ctx.drawImage(GCV,0,0,cv.width,cv.height);ctx.restore();}

/* ---------- cave (v1 ASCII), resampled to fit ---------- */
var CW0=0;CAVE.forEach(function(l){if(l.length>CW0)CW0=l.length;});var CH0=CAVE.length,WATER0=37;
var CV0=new Float32Array(CW0*CH0);CAVE.forEach(function(l,r){for(var c=0;c<l.length;c++){var k=RAMPI[l[c]];CV0[r*CW0+c]=(k===undefined?1:k)/9;}});
function caveFit(maxRows,maxCols){var s=Math.min(1,maxRows/CH0,maxCols/CW0);
  if(s>=0.999)return {w:CW0,h:CH0,v:CV0,water:WATER0};
  var w=Math.max(8,Math.round(CW0*s)),h=Math.max(8,Math.round(CH0*s)),v=new Float32Array(w*h),fx=CW0/w,fy=CH0/h;
  for(var r=0;r<h;r++)for(var c=0;c<w;c++){var x0=c*fx,x1=(c+1)*fx,y0=r*fy,y1=(r+1)*fy,sum=0,ar=0;
    for(var yy=Math.floor(y0);yy<Math.min(CH0,Math.ceil(y1));yy++)for(var xx=Math.floor(x0);xx<Math.min(CW0,Math.ceil(x1));xx++){var wx=Math.min(xx+1,x1)-Math.max(xx,x0),wy=Math.min(yy+1,y1)-Math.max(yy,y0);if(wx<=0||wy<=0)continue;sum+=CV0[yy*CW0+xx]*wx*wy;ar+=wx*wy;}
    v[r*w+c]=ar>0?Math.min(1,Math.pow(sum/ar,0.8)*1.08):0;}
  return {w:w,h:h,v:v,water:Math.round(WATER0*h/CH0)};}

/* ---------- state ---------- */
var scr=document.getElementById('scr'),cv=document.getElementById('cv'),ctx=cv.getContext('2d'),glowEl=document.getElementById('glow'),mail=document.getElementById('mail');
var G=null,cave=null,cx0=0,cy0=0,nameRow=0,t0=0,lastNow=0,stoke=0,sparks=[],nextSpark=0,raf=0,lastT=0,acc=0;
function nowS(){return performance.now()/1000;}
function put(c,r,s,l,p){if(r<0||r>=G.rows)return;for(var i=0;i<s.length;i++){var cc=c+i;if(cc<0||cc>=G.cols)continue;var ch=s[i];if(ch===' ')continue;var id=r*G.cols+cc;G.lum[id]=l;G.chr[id]=ch;G.pi[id]=p||0;}}
function typed(s,t0,cps,t){if(t<t0)return '';return s.slice(0,Math.min(s.length,Math.floor((t-t0)*cps)));}
function center(s){return Math.max(0,Math.round((G.cols-s.length)/2));}

/* timeline, in seconds from start */
var PRINT=2.4,NAME_AT=PRINT+0.35,URL_AT=NAME_AT+0.8,LIGHT_AT=NAME_AT+0.2,LIGHT_D=3.2,END=LIGHT_AT+LIGHT_D;

function layout(){var w=scr.clientWidth,h=scr.clientHeight,narrow=w<640,W=Math.max(2,Math.round(w*DPR)),H=Math.max(2,Math.round(h*DPR));
  if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H;}
  var cols=Math.round(clamp(w/(narrow?6.2:8.6),44,240));G=mkGrid(W,H,cols);
  cave=caveFit(Math.max(10,G.rows-(narrow?9:7)),G.cols-(narrow?8:4));
  var block=cave.h+3;cx0=Math.round((G.cols-cave.w)/2);cy0=Math.max(1,Math.round((G.rows-block)/2)-(narrow?2:0));nameRow=Math.min(G.rows-3,cy0+cave.h+1);}

/* the fire sits just below the frame, centred, and drifts a little */
function fireAt(now){return {x:G.cols*0.5+(RM?0:(vn2(now*0.35,1,61)-0.5)*G.cols*0.05),y:G.rows+1.5};}
function flick(now){return RM?1:0.84+0.1*vn2(now*6.5,0.5,3)+0.06*vn2(now*17,0.5,5);}

function frame(now,dt){var st=RM?END+1:now-t0,i;lastNow=now;
  G.lum.fill(0);G.pi.fill(0);
  /* cave: printed row by row, then the water moves and a little shimmer crosses the rock */
  var per=PRINT/cave.h,alive=RM?0:sstep(PRINT,PRINT+1.2,st),tt=now;
  for(var r=0;r<cave.h;r++){var rs=r*per;if(st<rs)break;var gr=cy0+r;if(gr<0||gr>=G.rows)continue;var vis=clamp((st-rs)/(per*1.1),0,1)*cave.w,boost=RM?0:0.4*clamp(1-(st-rs-per)/0.7,0,1),isW=r>=cave.water,dx=0;
    if(isW){var dep=clamp((r-cave.water)/(cave.h-cave.water),0,1);dx=alive*(0.6+1.6*dep)*Math.sin(tt*1.9-r*1.15)*0.6;}
    for(var c=0;c<vis;c++){var u=c+dx,u0=Math.floor(u),fu=u-u0,a=(u0>=0&&u0<cave.w)?cave.v[r*cave.w+u0]:0,b=(u0+1>=0&&u0+1<cave.w)?cave.v[r*cave.w+u0+1]:0,v=a+(b-a)*fu;
      if(!isW){var sh=vn2(c*0.35+tt*0.35,r*0.2-tt*0.6,3)*0.6+vn2(c*0.9-tt*0.5,r*0.5,4)*0.4;v*=1-alive*0.3*sh*sh*1.6;}else v*=1-alive*0.25*(0.5+0.5*Math.sin(c*0.6-tt*2.4+r*0.3));
      var k=clamp(Math.round(v*9),0,9);if(!k)continue;var gc=cx0+c;if(gc<0||gc>=G.cols)continue;var id=gr*G.cols+gc;G.lum[id]=clamp(0.25+0.75*v+boost,0,1);G.chr[id]=RAMP[k];G.pi[id]=boost>0.05?9:0;}}
  /* name and address */
  var nm='K A V E R N E',u2='kaverne.co';
  if(st>NAME_AT)put(center(nm),nameRow,typed(nm,NAME_AT,18,st),0.95);
  if(st>URL_AT&&nameRow+1<G.rows)put(center(u2),nameRow+1,typed(u2,URL_AT,24,st),0.5);
  /* firelight: it catches once the name is down, then stays; '.' or a tap stokes it */
  var lit=RM?1:sstep(LIGHT_AT,LIGHT_AT+LIGHT_D,st),F=fireAt(now),fl=flick(now)*(1+0.45*stoke),R=G.rows*0.62,R2=R*R,amb=lerp(1,0.62,lit);
  if(lit>0){for(i=0;i<G.n;i++){var l=G.lum[i];if(l<=0)continue;if(G.pi[i]===9){G.pi[i]=0;continue;}if(G.pi[i]===4)continue;
    var dxx=(i%G.cols)-F.x,dyy=(((i/G.cols)|0)-F.y)*1.85,L=fl*1.3/(1+(dxx*dxx+dyy*dyy)/R2);
    G.lum[i]=l*clamp(lerp(1,Math.max(amb,L),lit),0,1.2);G.pi[i]=Math.min(3,Math.round(3*lit*clamp(L*1.25-0.15,0,1)));}}
  else for(i=0;i<G.n;i++)if(G.pi[i]===9)G.pi[i]=0;
  /* a few sparks drift up out of the dark */
  if(!RM&&lit>0.3){if(now>=nextSpark){sparks.push({x:F.x+(Math.random()-0.5)*G.cols*0.08,y:G.rows-0.5,vy:2+Math.random()*2.5,life:0,max:2.5+Math.random()*3,s:Math.random()*99});nextSpark=now+1.1+Math.random()*2.2-(stoke*0.9);}
    for(i=sparks.length-1;i>=0;i--){var p=sparks[i];p.life+=dt;p.y-=p.vy*dt;p.x+=(vn2(p.s,now*0.8,7)-0.5)*dt*4;var k2=1-p.life/p.max;if(k2<=0||p.y<0){sparks.splice(i,1);continue;}
      var sc=Math.round(p.x),sr=Math.round(p.y);if(sc<0||sc>=G.cols||sr<0||sr>=G.rows)continue;var sid=sr*G.cols+sc;var sl=0.85*k2*k2;if(sl>G.lum[sid]){G.lum[sid]=sl;G.chr[sid]=k2>0.6?'*':k2>0.3?'\'':'.';G.pi[sid]=4;}}}
  stoke=Math.max(0,stoke-dt*0.45);
  drawCells(ctx,G,'#0A0A0A',0.035);glow(ctx,0.3+0.12*lit);
  glowEl.style.opacity=(lit*clamp(0.75+0.5*(fl-0.9),0.4,1.3)).toFixed(3);
  if(st>URL_AT+0.6)mail.classList.add('on');}

function loop(ts){raf=0;var now=ts/1000,dt=lastT?Math.min(0.1,now-lastT):0;lastT=now;acc+=dt;
  if(acc>=1/30||!dt){frame(now,acc);acc=0;}
  if(!RM&&!document.hidden)kick();else lastT=0;}
function kick(){if(!raf)raf=requestAnimationFrame(loop);}
function stokeIt(){if(RM)return;var st=nowS()-t0;if(st<END-LIGHT_D*0.5){t0=nowS()-END;return;}stoke=1;nextSpark=0;
  var F=fireAt(nowS());for(var i=0;i<5;i++)sparks.push({x:F.x+(Math.random()-0.5)*G.cols*0.1,y:G.rows-0.5-Math.random()*2,vy:3+Math.random()*3,life:0,max:2+Math.random()*2.5,s:Math.random()*99});kick();}
document.addEventListener('keydown',function(e){if(e.metaKey||e.ctrlKey||e.altKey)return;if(e.key==='.'){stokeIt();e.preventDefault();}});
scr.addEventListener('pointerdown',function(e){if(e.target.closest('a'))return;stokeIt();});
document.addEventListener('visibilitychange',function(){if(!document.hidden){lastT=0;kick();}});
new ResizeObserver(function(){if(!G)return;layout();if(RM)frame(nowS(),0);else kick();}).observe(scr);
RMQ.addEventListener&&RMQ.addEventListener('change',function(e){RM=e.matches;layout();frame(nowS(),0);kick();});

function boot(){layout();t0=nowS()+0.5;if(RM){frame(nowS(),0);mail.classList.add('on');}else kick();}
var fl0=document.fonts&&document.fonts.load?document.fonts.load('16px "JetBrains Mono"'):Promise.resolve();
Promise.race([fl0,new Promise(function(r){setTimeout(r,1500);})]).then(boot);
})();
</script>
