:root{
  color-scheme:dark;
  --bg:#0A0A0A; --text:#B8B8B8; --hi:#E6E6E6; --chrome:#5E5E5E; --faint:#3A3A3A; --ember:#E07A34;

}
*{box-sizing:border-box}
html,body{height:100%}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:400 var(--fs)/var(--lh) var(--mono);-webkit-text-size-adjust:100%;font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0;overflow:hidden}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

.scr{position:relative;height:100%;min-height:440px;overflow:hidden}
.top,.bot{position:absolute;left:var(--m);right:var(--m);display:flex;justify-content:space-between;gap:16px;font-size:.78em;line-height:1.4}
.top{top:calc(var(--m) * .55)}
.bot{bottom:calc(var(--m) * .55)}
.mark{color:var(--chrome)}
.top .mark{white-space:nowrap}
.mail{color:var(--chrome);text-decoration:none;white-space:nowrap;transition:color .4s}
.mail:hover,.mail:focus-visible{color:var(--hi)}
.count{color:var(--faint);font-variant-numeric:tabular-nums;text-align:right}
.what{display:block;color:var(--text);margin-top:.5em;white-space:normal}
.tally{display:block;color:var(--faint);font-variant-numeric:tabular-nums;margin-top:.5em}

/* the stream: newest at the bottom, older lines dim as they rise */
.feed{position:absolute;left:var(--m);right:var(--m);top:calc(var(--m) * 1.4);bottom:calc(var(--m) * .55 + 5.2em);overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 38%);mask-image:linear-gradient(to bottom,transparent 0,#000 38%)}
.row{display:grid;grid-template-columns:6ch 14ch minmax(0,1fr);column-gap:2ch;white-space:pre-wrap;transition:color 1.2s,opacity 2.4s ease-out}
.row .t{color:var(--chrome);font-variant-numeric:tabular-nums}
.row .c{color:var(--chrome);overflow:hidden;text-overflow:clip;white-space:nowrap}
.row.ours .c,.row.ours .x{color:var(--hi)}
.row.edge .x{color:var(--chrome)}
.row.note{grid-template-columns:minmax(0,1fr)}
.row.note .x{color:var(--chrome)}
.cur{display:inline-block;width:.6em;height:1.1em;vertical-align:-.2em;background:var(--chrome);margin-left:1px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* one line of planet: where it is night right now */
.band{position:absolute;left:var(--m);right:var(--m);bottom:calc(var(--m) * .55 + 2.2em);height:1.6em}
.band .cells{position:absolute;left:0;right:0;top:0;height:3px;display:flex;gap:2px}
.band .cells i{flex:1 1 0;background:var(--faint);opacity:.35;transition:opacity 4s,background 4s}
.band .cells i.n{background:var(--text);opacity:.55}
.band .pin{position:absolute;top:-6px;width:1px;height:15px;background:var(--ember)}
.band .lab{position:absolute;top:14px;font-size:.72em;color:var(--chrome);transform:translateX(-50%);white-space:nowrap;font-variant-numeric:tabular-nums}
.band .lab b{font-weight:400;color:var(--hi)}

/* prisoner’s cinema: faint shapes made from the stream’s own letters, flickering like firelight */
.glow{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.row.drift .x{color:var(--text);font-style:italic}
.row.drift .c{color:var(--faint)}
@media (max-width:640px){.row{grid-template-columns:5ch 9ch minmax(0,1fr);column-gap:1.4ch}.row .c .r{display:block}.here{display:none}.band{bottom:calc(var(--m) * .55 + 4.4em)}.feed{bottom:calc(var(--m) * .55 + 7.6em)}}
@media (prefers-reduced-motion:reduce){.cur{animation:none}}
</style>

function scaled(m,k){var c=Math.max(4,Math.round(m.c*k)),r=Math.max(3,Math.round(m.r*k));return {c:c,r:r,v:function(x,y){var fx=x/k,fy=y/k,x0=Math.min(m.c-1,Math.floor(fx)),y0=Math.min(m.r-1,Math.floor(fy)),x1=Math.min(m.c-1,x0+1),y1=Math.min(m.r-1,y0+1),tx=fx-x0,ty=fy-y0;

document.addEventListener('keydown',function(e){if(e.key==='.'&&!e.metaKey&&!e.ctrlKey){var rows=feed.querySelectorAll('.row .x');if(rows.length)spawn(rows[rows.length-1-((Math.random()*Math.min(4,rows.length))|0)].textContent,true);}});
/* one every 30 to 60 seconds, made from whatever line just went past */
var nextAuto=performance.now()+30000+Math.random()*30000;
setInterval(function(){var t=performance.now();if(t<nextAuto||document.hidden)return;var rows=feed.querySelectorAll('.row .x');if(rows.length)spawn(rows[rows.length-1].textContent,true);nextAuto=t+30000+Math.random()*30000;},1000);

/* ---------- the stream ---------- */
var MAX=40,last={},lastEdge=0,lastOurs=0,sinceNote=0;
function row(cls,time,city,text){
  var r=document.createElement('div');r.className='row'+(cls?' '+cls:'');
  if(cls==='note'){var x=document.createElement('span');x.className='x';r.appendChild(x);feed.appendChild(r);age();return x;}
  var a=document.createElement('span');a.className='t';a.textContent=time;
  var b=document.createElement('span');b.className='c';var sl=city.indexOf('/');b.textContent=sl<0?city:city.slice(0,sl);if(sl>=0){var rl=document.createElement('span');rl.className='r';rl.textContent=city.slice(sl);b.appendChild(rl);}
  var x2=document.createElement('span');x2.className='x';r.appendChild(a);r.appendChild(b);r.appendChild(x2);feed.appendChild(r);
  age();
  return x2;
}
/* the newest lines stay lit; older ones fade as they rise, then go */
var KEEP=6,FADE=7;
function age(){
  var rows=feed.children,n=rows.length;
  for(var i=0;i<n;i++){var k=n-1-i,o=k<KEEP?1:Math.max(0,1-(k-KEEP+1)/FADE);rows[i].style.opacity=o.toFixed(2);}
  while(feed.children.length>KEEP+FADE+1)feed.removeChild(feed.firstChild);
}
var cur=document.createElement('span');cur.className='cur';
function type(el,text,cps){
  return new Promise(function(res){
    if(RM){el.textContent=text;res();return;}
    var i=0;el.appendChild(cur);
    (function step(){if(i>=text.length){res();return;}el.insertBefore(document.createTextNode(text[i++]),cur);setTimeout(step,1000/cps*(0.6+Math.random()*0.8));})();
  });
}
/* ---------- long jobs that come back further along ---------- */
var JOBS=[
 {t:'a novel is being translated. chapter {n} of {max}.',a:' the jokes are the hard part.',max:31,step:[1,3],done:'the novel is translated. someone will read it first thing.'},
 {t:'an old film is being cleaned. frame {n} of {max}.',a:' the scratches go first.',max:86400,step:[1800,5200],done:'the film is clean. it looks like the year it was made.'},
 {t:'the buses are rescheduled for snow. route {n} of {max}.',max:212,step:[9,28],done:'every bus has a new timetable. it will snow at seven.'},
 {t:'a dictionary for a language with 900 speakers. entry {n}.',a:' there are eleven words for rain.',max:4000,step:[40,140],done:'the dictionary has 4,000 words. the speakers have more.'},
 {t:'someone’s old photos are being restored. {n} of {max}.',a:' most are of the same dog.',max:1300,step:[30,95],done:'all 1,300 photos restored. it was a good dog.'},
 {t:'a harvest forecast for six valleys. valley {n} of {max}.',max:6,step:[1,1],done:'six valleys, all fine. the rain comes thursday.'},
 {t:'a city’s street trees are counted from the air. {n} of {max}.',a:' the oaks are winning.',max:48000,step:[2000,6000],done:'48,000 trees, counted. the oaks won.'},
 {t:'a choir’s concert is mixed. song {n} of {max}.',a:' the altos asked to be louder.',max:14,step:[1,2],done:'the concert is mixed. the altos are louder.'},

 {t:'a radio archive is digitised. tape {n} of {max}.',a:' tape 212 is just someone laughing.',max:740,step:[15,45],done:'740 tapes, saved. the laughing one is everyone’s favourite.'},
 {t:'a hospital’s scans are checked overnight. {n} of {max}.',max:380,step:[12,40],done:'380 scans checked. the doctors start at eight.'},
 {t:'a family cookbook is typed up. recipe {n} of {max}.',a:' the measurements are “some” and “enough”.',max:212,step:[6,19],done:'212 recipes, typed. “enough” is now 200 grams.'},
 {t:'a forest’s camera traps are sorted. photo {n} of {max}.',a:' mostly deer. one very surprised badger.',max:9000,step:[250,800],done:'9,000 photos sorted. the badger has a name now.'}
];
var threads=[],lastThread=0,jobBag=[];
function newThread(dark){if(!jobBag.length)jobBag=JOBS.slice();var j=jobBag.splice((Math.random()*jobBag.length)|0,1)[0];
  return {j:j,n:Math.max(1,Math.round(j.max*(0.05+Math.random()*0.3))),city:rnd(dark).c};}
function fmtN(n){return n.toLocaleString('en-US');}
function threadLine(th){var j=th.j;
  if(th.n>=j.max)return j.done;
  var line=j.t.replace('{n}',fmtN(th.n)).replace('{max}',fmtN(j.max))+(th.seen?'':(j.a||''));th.seen=true;return line;}
var marks={},SEEDING=false;
function pick(){
  var now=Date.now(),opts=CITIES.map(function(c){var t=local(c[1]);return {c:c,t:t,p:phase(t.h)};});
  /* exact edges, by the real clock: a countdown to first light, then the handover; cities joining at 22:00 */
  var day=NOW().toISOString().slice(0,10);
  if(!SEEDING){
    var kinds=[
      {k:'c',test:function(t){return t.h===5&&t.m>=55;},text:function(t){var n=60-t.m;return 'first light in '+n+(n===1?' minute.':' minutes.');}},
      {k:'d',test:function(t){return t.h===6&&t.m<3;},text:function(){return 'first light. it hands over.';}},
      {k:'j',test:function(t){return t.h===22&&t.m<3;},text:function(){return 'joins the night shift.';}}
    ];
    for(var kk=0;kk<kinds.length;kk++){var K=kinds[kk],hit=opts.filter(function(o){return K.test(o.t)&&!marks[o.c[0]+K.k+day];});
      if(!hit.length)continue;
      hit.forEach(function(o){marks[o.c[0]+K.k+day]=1;});
      var home=hit.filter(function(o){return o.c[0]===HOME;})[0];
      if(home&&K.k==='j')return {cls:'ours',time:home.t.s,city:'kaverne/people',text:'\u2192 agents: it\u2019s yours. see you at six.'};
      if(home&&K.k==='d')return {cls:'ours',time:home.t.s,city:'kaverne/review',text:'\u2192 people: it\u2019s on the desk. over to you.'};
      var first=hit[0],others=hit.slice(1).map(function(o){return o.c[0];});
      var tail=others.length?'  ('+(others.length===1?others[0]:others.slice(0,-1).join(', ')+' and '+others[others.length-1])+' too)':'';
      return {cls:'edge',time:first.t.s,city:first.c[0],text:K.text(first.t)+tail};
    }
  }
  /* a long job, every so often, picked up where it left off */

  if(now-lastThread>25000&&Math.random()<0.3&&darkOpts.length){
    lastThread=now;while(threads.length<3)threads.push(newThread(darkOpts));
    var th=rnd(threads),tz=CITIES.filter(function(c){return c===th.city;})[0],tt=local(tz[1]);
    var line=threadLine(th);
    if(th.n>=th.j.max)threads.splice(threads.indexOf(th),1);else th.n=Math.min(th.j.max,th.n+th.j.step[0]+Math.round(Math.random()*(th.j.step[1]-th.j.step[0])));

  /* the edges of the night: dawn and dusk, wherever they are right now */
  var edges=opts.filter(function(o){return o.p==='dawn'||o.p==='dusk';});
  if(edges.length&&now-lastEdge>11000&&Math.random()<0.35){lastEdge=now;var e=rnd(edges);return {cls:'edge',time:e.t.s,city:e.c[0],text:fresh(e.p==='dawn'?DAWN:DUSK,e.p)};}
  var dark=opts.filter(function(o){return o.p==='night'&&(!last[o.c[0]]||now-last[o.c[0]]>20000);});
  if(!dark.length)dark=opts.filter(function(o){return o.p==='night';});
  var o=rnd(dark);last[o.c[0]]=now;return {cls:'',time:o.t.s,city:o.c[0],text:fresh(NIGHT,'n')};
}
function note(){
  var opts=CITIES.map(function(c){return {c:c,p:phase(local(c[1]).h)};}),dark=opts.filter(function(o){return o.p==='night';});
  var d=NOW(),utc=d.getUTCHours()+d.getUTCMinutes()/60,mid=((24-utc)*15+540)%360-180;
  var region=mid<-120?'the pacific':mid<-30?'the americas':mid<-10?'the atlantic':mid<40?'europe and africa':mid<75?'the gulf':mid<100?'india':mid<145?'east asia':'the western pacific';
  return rnd(['the middle of the night is over '+region+' now.','the dark is moving west at about 1,670 km an hour.','night in '+dark.length+' cities. the shift is never empty.','somewhere, it’s 03:00. it always is.']);
}
async function loop(){
  for(;;){
    drawBand();
    sinceNote++;
    if(sinceNote>14&&Math.random()<0.25){sinceNote=0;var nx=row('note');await type(nx,'',60);await wait(500);await type(nx,note(),18);await wait(1800);continue;}
    var e=pick(),x=row(e.cls,e.time,e.city);
    if(e.cls==='ours')sr.textContent='kaverne: '+e.text;
    await type(x,e.text,e.cls==='ours'?15:22);
    /* pacing: mostly steady, sometimes a burst, now and then a held breath */
    var r=Math.random(),gap=r<0.2?rnd([300,450,600]):r<0.9?900+Math.random()*1500:3200+Math.random()*2400;
    await wait(gap);
  }
}
function wait(ms){return new Promise(function(r){setTimeout(r,RM?ms*1.5:ms);});}

if(window.claude&&window.claude.use)window.claude.use('room').then(function(r){if(!r)return;r.presence({seat:1}).catch(function(){});r.onPeers(function(c){SEATS=c.peers.length;});}).catch(function(){});
drawBand();tick();setInterval(drawBand,30000);setInterval(tick,1000);
/* open mid-stream, the way you'd tune in */
(function seed(){SEEDING=true;for(var k=0;k<7;k++){var e=pick(),x=row(e.cls,e.time,e.city);x.textContent=e.text;}SEEDING=false;lastOurs=Date.now();lastThread=0;})();

})();
