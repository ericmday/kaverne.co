<!doctype html>
<title>Kaverne · connect</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A0A0A">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&display=swap">
<style>
/* exploration: open a line into the cave. the world's night keeps going, faintly, above the conversation.
   the crew is named in the header; whoever is speaking lights up. the work they show is drawn in the stream. */
:root{
  color-scheme:dark;
  --bg:#0A0A0A; --text:#B8B8B8; --hi:#E6E6E6; --chrome:#5E5E5E; --faint:#3A3A3A; --ember:#E07A34;
  --mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --fs:clamp(12.5px,1.12vw,18px); --lh:1.7;
  --m:clamp(20px,8vw,120px);
}
*{box-sizing:border-box}
html,body{height:100%}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:400 var(--fs)/var(--lh) var(--mono);-webkit-text-size-adjust:100%;font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0;overflow:hidden}
.scr{position:relative;height:100%;min-height:440px;overflow:hidden}
.top,.bot{position:absolute;left:var(--m);right:var(--m);display:flex;justify-content:space-between;gap:16px;font-size:.78em;line-height:1.4}
.top{top:calc(var(--m) * .55)}
.bot{bottom:calc(var(--m) * .55)}
.mark{color:var(--chrome)}
.what{display:block;color:var(--text);margin-top:.5em}
.count{color:var(--faint);font-variant-numeric:tabular-nums;text-align:right}
.mail,.forget{color:var(--chrome);text-decoration:none;transition:color .4s}
.mail:hover,.mail:focus-visible,.forget:hover,.forget:focus-visible{color:var(--hi);outline:none}
.forget{all:unset;font:inherit;color:var(--chrome);cursor:pointer}

/* the crew: everyone awake, the speaker lit */
.crew{display:block;margin-top:.5em;color:var(--faint);opacity:0;transition:opacity 2.4s}
.crew.on{opacity:1}
.crew i{font-style:normal;transition:color .6s}
.crew i.lit{color:var(--hi)}
.crew i.ppl{color:var(--chrome)}

.feed{position:absolute;left:var(--m);right:var(--m);top:calc(var(--m) * 1.4);bottom:calc(var(--m) * .55 + 4.4em);overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 30%);mask-image:linear-gradient(to bottom,transparent 0,#000 30%)}
.row{display:grid;grid-template-columns:6ch 14ch minmax(0,1fr);column-gap:2ch;white-space:pre-wrap;transition:color 1.2s,opacity 2.4s ease-out}
.row .t{color:var(--chrome);font-variant-numeric:tabular-nums}
.row .c{color:var(--chrome);overflow:hidden;white-space:nowrap}
.row.world .x,.row.world .c,.row.world .t{color:var(--faint)}
.row.ours .c,.row.ours .x{color:var(--hi)}
.row.you .c{color:var(--ember)}
.row.you .x{color:var(--text)}
.row.sys .x{color:var(--chrome)}
/* the work: drawn, not written */
.row.art{margin:.35em 0 .6em}
.row.art .x{color:var(--text);white-space:pre;line-height:1.25;overflow:hidden}
.row.art .x b{font-weight:400;color:var(--hi)}
.row.art .x u{text-decoration:none;color:var(--chrome)}
.sw{display:inline-block;width:8ch;height:2.2em;vertical-align:top;margin-right:1ch}
.swl{display:inline-block;width:8ch;margin-right:1ch;color:var(--chrome);font-size:.82em;font-variant-numeric:tabular-nums}
.spec{display:block;color:var(--hi);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spec.a{font:italic 400 1.7em/1.2 Georgia,"Times New Roman",serif}
.spec.b{font:700 1.15em/1.5 "Helvetica Neue",Arial,sans-serif;text-transform:uppercase;letter-spacing:.22em}
.spec.c{font:400 1em/1.6 var(--mono);color:var(--text)}
.cur{display:inline-block;width:.6em;height:1.1em;vertical-align:-.2em;background:var(--chrome);margin-left:1px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* the line you type on */
.line{position:absolute;left:var(--m);right:var(--m);bottom:calc(var(--m) * .55 + 2em);display:grid;grid-template-columns:6ch 14ch minmax(0,1fr);column-gap:2ch;align-items:baseline}
.line .t{color:var(--chrome);font-variant-numeric:tabular-nums}
.line .c{color:var(--ember)}
.line input,.line button{all:unset;font:inherit;color:var(--hi);caret-color:var(--ember);width:100%}
.line button{color:var(--chrome);cursor:pointer;transition:color .4s;width:auto}
.line button:hover,.line button:focus-visible{color:var(--hi)}
.line input::placeholder{color:var(--faint)}
.line.off{visibility:hidden}
.line a{color:var(--hi);text-decoration:none;border-bottom:1px solid var(--faint)}
.line a:hover,.line a:focus-visible{border-color:var(--ember);outline:none}

@media (max-width:640px){
  .row,.line{grid-template-columns:5ch 9ch minmax(0,1fr);column-gap:1.4ch}
  .row .c .r{display:block}.here{display:none}
  .feed{top:calc(var(--m) * .55 + 8.5em)}
  .row.art .x{grid-column:1/-1;font-size:.82em}
  .crew{max-width:24ch;margin-left:auto}
  .line{bottom:calc(var(--m) * .55 + 3.6em)}
  .feed{bottom:calc(var(--m) * .55 + 6em)}
}
@media (prefers-reduced-motion:reduce){.cur{animation:none}.crew,.row{transition:none}}
</style>

<main class="scr">
  <div class="top"><span class="mark">kaverne &nbsp;&middot;&nbsp; night shift<span class="what">an agentic creative studio. people by day, agents by night.</span></span><span class="count"><span id="count"></span><span class="crew" id="crew" aria-hidden="true"></span></span></div>
  <div class="feed" id="feed" role="log" aria-live="polite" aria-label="the night shift"></div>
  <form class="line" id="line" autocomplete="off">
    <span class="t" id="lt"></span><span class="c">you</span>
    <span id="slot"><button type="button" id="go">› connect to the night shift</button></span>
  </form>
  <div class="bot"><span class="mark">nothing you type leaves this page.<span id="mem"></span></span><a class="mail" href="mailto:hello@kaverne.co">hello@kaverne.co</a></div>
</main>

<script>
(function(){
var TZ='America/Los_Angeles',RM=matchMedia('(prefers-reduced-motion: reduce)').matches,KEY='kaverne.line';
var $=function(id){return document.getElementById(id);};
var feed=$('feed'),line=$('line'),slot=$('slot'),lt=$('lt'),count=$('count'),crewEl=$('crew'),mem=$('mem');
var fmt={};function local(tz,sec){var k=tz+(sec?'s':'');var f=fmt[k]||(fmt[k]=new Intl.DateTimeFormat('en-GB',{timeZone:tz,hour:'2-digit',minute:'2-digit',second:sec?'2-digit':undefined,hourCycle:'h23'}));var p={};f.formatToParts(new Date()).forEach(function(x){p[x.type]=x.value;});return {h:+p.hour,s:p.hour+':'+p.minute+(sec?':'+p.second:'')};}
function rnd(a){return a[(Math.random()*a.length)|0];}
function wait(ms){return new Promise(function(r){setTimeout(r,RM?ms*0.3:ms);});}
function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function tick(){count.innerHTML=local(TZ,true).s+'<span class="here"> here</span>';lt.textContent=local(TZ).s;}
setInterval(tick,1000);tick();

/* ---------- rows ---------- */
function row(cls,time,who){var r=document.createElement('div');r.className='row'+(cls?' '+cls:'');
  var a=document.createElement('span');a.className='t';a.textContent=time;
  var b=document.createElement('span');b.className='c';var sl=who.indexOf('/');b.textContent=sl<0?who:who.slice(0,sl);if(sl>=0){var q=document.createElement('span');q.className='r';q.textContent=who.slice(sl);b.appendChild(q);}
  var x=document.createElement('span');x.className='x';r.appendChild(a);r.appendChild(b);r.appendChild(x);feed.appendChild(r);
  while(feed.children.length>48)feed.removeChild(feed.firstChild);return x;}
function type(el,text,cps){return new Promise(function(res){if(RM){el.textContent=text;res();return;}var cur=document.createElement('span');cur.className='cur';el.appendChild(cur);var i=0;
  (function step(){if(i>=text.length){cur.remove();res();return;}el.insertBefore(document.createTextNode(text[i++]),cur);setTimeout(step,1000/cps*(0.6+Math.random()*0.8));})();});}

/* ---------- the world's night, faint, never stopping ---------- */
var CITIES=[['tokyo','Asia/Tokyo'],['seoul','Asia/Seoul'],['sydney','Australia/Sydney'],['auckland','Pacific/Auckland'],['manila','Asia/Manila'],['mumbai','Asia/Kolkata'],['dubai','Asia/Dubai'],['nairobi','Africa/Nairobi'],['lisbon','Europe/Lisbon'],['reykjavik','Atlantic/Reykjavik'],['new york','America/New_York'],['chicago','America/Chicago'],['honolulu','Pacific/Honolulu'],['anchorage','America/Anchorage'],['são paulo','America/Sao_Paulo'],['lagos','Africa/Lagos']];
var NIGHT=['a backup completes. it always does.','a tsunami buoy reports nothing. that’s the good news.','a lighthouse foghorn stays quiet. clear night.','a seed vault in the arctic checks its temperature. cold enough.','a bakery’s ovens preheat themselves at three.','a crossword is checked. seventeen across was wrong.','a drone counts a flock of sheep and gets the same number twice.','a satellite reboots itself above the pacific.','a podcast is cleaned of every “um”.','a heart monitor in room 4 keeps steady time.','a canal lock fills for a boat due at dawn.','a cleaning robot finds a stuffed rabbit and goes around it.','a radio dish listens to the sky. mostly static. mostly.','a weather balloon is let go at midnight, on schedule.','a painting is x-rayed. there’s another painting underneath.','a night bus runs empty for one stop.','a garage door closes itself because somebody forgot.','a menu is translated. the jokes don’t make it.'];
var used=[];function night(){var c=NIGHT.filter(function(x){return used.indexOf(x)<0;});if(!c.length){used=[];c=NIGHT;}var x=rnd(c);used.push(x);return x;}
var connected=false,busy=false,AWAKE=0;
function dark(){return CITIES.filter(function(c){var h=local(c[1]).h;return h>=22||h<6;});}
async function world(){for(;;){if(!busy){var d=dark(),c=d.length?rnd(d):rnd(CITIES);var x=row(connected?'world':'',local(c[1]).s,c[0]);
  if(connected)x.textContent=night();else await type(x,night(),24);}
  await wait(connected?8000+Math.random()*8000:1600+Math.random()*1800);}}

/* ---------- the crew ---------- */
var CREW=['boards','look','gen','cut','sound','score','colour','type','logo','design','words','review'],PEOPLE=0;
function drawCrew(awake){crewEl.innerHTML=awake.map(function(r){return '<i data-r="'+r+'">'+r+'</i>';}).join(' ')+'  <i class="ppl">'+(PEOPLE?PEOPLE+' people':'0 people')+'</i>';}
function lit(role){[].forEach.call(crewEl.querySelectorAll('i[data-r]'),function(i){i.classList.toggle('lit',i.getAttribute('data-r')===role);});}

/* ---------- reading what you said ---------- */
var STOP={a:1,an:1,the:1,for:1,of:1,to:1,and:1,that:1,which:1,only:1,at:1,in:1,on:1,my:1,our:1,new:1,about:1,with:1,is:1,it:1,we:1,i:1,some:1,this:1,just:1,really:1,very:1,like:1,want:1,need:1,make:1,making:1,something:1};
function words(s){return s.toLowerCase().replace(/[^a-z0-9’'\s-]/g,' ').split(/\s+/).filter(function(w){return w&&!STOP[w];});}
function frag(s){s=s.trim().replace(/\s+/g,' ').replace(/[.!?]+$/,'').toLowerCase();var m=s.match(/\b(?:for|about|of) (.{6,})$/);if(m)s=m[1];var w=s.split(' ');return w.length>9?w.slice(0,9).join(' ')+'…':s;}
/* the noun the work is about: the first real word after "for/about/of", else the last real word */
function subject(s){var m=s.toLowerCase().match(/\b(?:for|about|of) (.+)$/);var w=words(m?m[1]:s);var kinds=/^(logo|logos|brand|identity|film|video|website|site|app|album|song|book|poster|campaign|short|ad|record|music)$/;w=w.filter(function(x){return !kinds.test(x);});return w[0]||'kaverne';}
var HUES={red:5,orange:25,amber:38,yellow:52,gold:45,green:125,olive:80,teal:175,cyan:188,blue:215,navy:225,indigo:245,purple:270,violet:265,lilac:280,pink:330,magenta:310,brown:28,rust:18};
function colourWish(s){s=(s||'').toLowerCase();var no=[],yes=[];Object.keys(HUES).forEach(function(c){var re=new RegExp('(not|no|never|without|avoid|hate)\\s+(any\\s+)?'+c);if(re.test(s))no.push(c);else if(new RegExp('\\b'+c+'\\b').test(s))yes.push(c);});return {no:no,yes:yes};}

/* ---------- the work ---------- */
function hsl2hex(h,s,l){s/=100;l/=100;var k=function(n){return (n+h/30)%12;},a=s*Math.min(l,1-l),f=function(n){return l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));};return '#'+[f(0),f(8),f(4)].map(function(x){return Math.round(x*255).toString(16).padStart(2,'0');}).join('').toUpperCase();}
function near(h,c){var d=Math.abs(((h-HUES[c])%360+540)%360-180);return d<28;}
function palette(seed,wish){var h=hash(seed)%360;
  if(wish.yes.length)h=(HUES[wish.yes[0]]+200)%360;
  var spec=[[h,22,12],[h+18,26,30],[wish.yes.length?HUES[wish.yes[0]]:h+165,58,56],[h+8,16,86]];
  spec=spec.map(function(p){var hh=(p[0]%360+360)%360;for(var g=0;g<12&&wish.no.some(function(c){return near(hh,c);});g++)hh=(hh+31)%360;return hsl2hex(hh,p[1],p[2]);});
  return spec;}
function swatches(cols){return '<span>'+cols.map(function(c){return '<span class="sw" style="background:'+c+'"></span>';}).join('')+'</span>\n<span>'+cols.map(function(c){return '<span class="swl">'+c+'</span>';}).join('')+'</span>';}
function marks(subj,brief){var a=subj[0],ws=words(brief||subj).filter(function(x){return /^[a-z]/.test(x)&&!/^(logo|logos|brand|identity|wordmark|mark)$/.test(x);}),b=ws.length>1?ws[0][0]+'·'+ws[ws.length-1][0]:a+'·',w=subj.slice(0,10);
  var pad=function(s,n){while(s.length<n)s+=' ';return s;};
  return ['╭─────╮   ┌───────┐   '+w+'.',
          '│  <b>'+a+'</b>  │   │ <b>'+pad(b,5)+'</b> │   '+'─'.repeat(w.length+1),
          '╰─────╯   └───────┘   ',
          '<u>  1         2         3</u>'].join('\n');}
function boards(){return ['┌───────────┐ ┌───────────┐ ┌───────────┐',
  '│           │ │     ▪     │ │ ▪         │',
  '│───────────│ │    ▐█▌    │ │           │',
  '│     ·     │ │    ▐█▌    │ │      ▬▬▬▬ │',
  '└───────────┘ └───────────┘ └───────────┘',
  '<u>  1 wide        2 close       3 the end</u>'].join('\n');}
function wave(seed){var b='▁▂▃▄▅▆▇',h=hash(seed),out='';for(var i=0;i<40;i++){var t=i/39,env=Math.sin(Math.PI*Math.min(1,t*1.3))*(t>.7?1:.55);h=Math.imul(h^(h>>>15),2246822507)>>>0;var v=Math.max(0,Math.min(6,Math.round(env*6*(.55+(h%100)/220))));out+=b[v];}
  return out+'\n<u>quiet                          then not</u>';}
function wire(subj){return ['┌──────────────────────────┐',
  '│ <b>'+subj.slice(0,8)+'</b>'+' '.repeat(Math.max(1,17-Math.min(8,subj.length)))+'▬ ▬ ▬ │',
  '│                          │',
  '│   ████████████████       │',
  '│   ▬▬▬▬▬▬▬▬▬▬             │',
  '│                          │',
  '│   [ ▬▬▬▬▬ ]              │',
  '└──────────────────────────┘',
  '<u>  one screen. one idea. one button.</u>'].join('\n');}
function specimen(subj){var s=subj.replace(/</g,'');return '<span class="spec a">'+s+'</span><span class="spec b">'+s+'</span><span class="spec c">'+s.split('').join(' ')+'</span>';}

async function say(cls,who,text,cps){if(who.indexOf('kaverne/')===0)lit(who.slice(8));var x=row(cls,local(TZ).s,who);await type(x,text,cps||18);await wait(500+Math.random()*700);}
async function show(who,html,byLine){lit(who.slice(8));var x=row('art',local(TZ).s,'');
  if(RM||!byLine){x.innerHTML=html;await wait(900);return;}
  var lines=html.split('\n');for(var i=0;i<lines.length;i++){x.innerHTML+= (i?'\n':'')+lines[i];await wait(140);}await wait(900);}

/* ---------- what each kind of work gets ---------- */
var DOMAINS=[
 {id:'logo',k:/logo|brand|identity|mark|wordmark/i,crew:['logo','type','colour','design','review'],
  first:function(f){return [['logo','→ type: “'+f+'”. sketching marks. forty, then one.'],['type','→ colour: it’s going to want a typeface before it wants a colour.']];},ask:['colour','→ you: is there a colour it can’t be?'],
  work:['marks','specimen','palette'],
  after:['logo','→ review: mark 3 holds at 16 pixels. 1 doesn’t.','type','→ logo: the counter in the a is closing up small. opening it.','colour','→ logo: tried the mark in one colour. it’s stronger.','review','→ logo: 2 is clever. that’s the problem with it.','design','→ logo: clear space is the height of the x.']},
 {id:'film',k:/film|video|\bad\b|commercial|trailer|short|documentary|spot|reel/i,crew:['boards','gen','cut','sound','colour','review'],
  first:function(f){return [['boards','→ cut: “'+f+'”. first frames by morning.'],['sound','→ boards: what does it sound like with the picture off?']];},ask:['cut','→ you: how long does it get to be?'],
  work:['boards','palette'],
  after:['cut','→ boards: frame 2 is the film. the others are setting it up.','gen','→ cut: twelve takes of frame 2. the light only behaves in three.','sound','→ cut: room tone under the end. the silence was too clean.','colour','→ cut: matching the close-up to the wide on the skin, not the sky.','review','→ everyone: shorter. it’s always shorter.']},
 {id:'music',k:/song|album|music|track|record|band|\bep\b|single|score/i,crew:['score','sound','design','colour','review'],
  first:function(f){return [['score','→ sound: “'+f+'”. listening first. no notes yet.'],['design','→ score: the cover has to work at the size of a thumbnail.']];},ask:['score','→ you: what should it feel like at the end?'],
  work:['wave','palette'],
  after:['score','→ sound: down a semitone. it sat too bright.','sound','→ score: the kick and the bass fight at 60 hz. carving the bass.','design','→ colour: the cover reads from across a room now.','review','→ score: took the drums out of verse two. it breathes.']},
 {id:'words',k:/book|novel|script|story|poem|essay|copy|writing|newsletter|zine/i,crew:['words','type','design','review'],
  first:function(f){return [['words','→ review: “'+f+'”. reading it aloud before touching it.'],['type','→ words: a page that size wants about sixty characters a line.']];},ask:['words','→ you: who is it for? one person is enough.'],
  work:['specimen'],
  after:['words','→ review: cut every “very”. nothing got weaker.','type','→ words: a widow on page two. one word cut, gone.','words','→ type: the title wants to break after the second word.','review','→ words: say the thing you’re scared to say.']},
 {id:'site',k:/site|website|\bapp\b|web|page|product|launch|platform/i,crew:['design','words','type','colour','review'],
  first:function(f){return [['design','→ words: “'+f+'”. one idea per screen. which one goes first?'],['words','→ design: the button can’t say “submit”.']];},ask:['design','→ you: what should someone do in the first ten seconds?'],
  work:['wire','specimen'],
  after:['design','→ review: moved everything four pixels. you’d have felt it.','colour','→ design: the link colour passes 4.5:1 now.','words','→ design: the headline was nine words. it’s four.','type','→ design: the measure was ninety characters. sixty now.']},
 {id:'print',k:/poster|print|packaging|label|magazine|book cover|flyer|card/i,crew:['design','colour','type','review'],
  first:function(f){return [['design','→ colour: “'+f+'”. paper first, then everything else.'],['colour','→ design: the screen is rgb. the paper isn’t. noted early.']];},ask:['design','→ you: where will people see it?'],
  work:['palette','specimen'],
  after:['colour','→ design: rich black, 60/40/40/100. the plain black proofed grey.','design','→ type: 3 mm bleed. the photo stopped a millimetre short.','type','→ design: that hairline won’t survive uncoated stock.','review','→ design: the white space is doing the work. leave it.']}
];
var DEFAULT={id:'any',crew:['look','boards','words','colour','review'],
  first:function(f){return [['look','→ boards: “'+f+'”. forty directions. most will be bad. that’s the point.'],['words','→ look: say it in one sentence first.']];},ask:['review','→ you: what would make you say “that’s it”?'],
  work:['boards','palette'],
  after:['look','→ review: six directions. one is strange. keeping it.','boards','→ look: frame 3 has the light.','colour','→ look: warm highlights, cool shadows.','review','→ everyone: the safe one is in the folder. so is the one we’d make.']};
var WORK_LINE={
  marks:['logo','→ you: three marks. the third is the one nobody asked for.'],
  specimen:['type','→ you: “{s}”, three ways.'],
  palette:['colour','→ you: four colours.{wish}'],
  boards:['boards','→ you: three frames. 2 is the one.'],
  wave:['score','→ you: the shape of it, before any notes.'],
  wire:['design','→ you: the first screen. one idea, one button.']
};

/* ---------- memory: only in this browser ---------- */
function recall(){try{var m=JSON.parse(localStorage.getItem(KEY)||'null');if(m&&Date.now()-m.t<7*864e5)return m;}catch(e){}return null;}
function remember(m){try{localStorage.setItem(KEY,JSON.stringify(m));}catch(e){}showForget();}
function showForget(){mem.innerHTML=recall()?' · <button class="forget" id="fg">forget me</button>':'';var b=$('fg');if(b)b.onclick=function(){try{localStorage.removeItem(KEY);}catch(e){}mem.textContent=' · forgotten.';};}

/* ---------- the conversation ---------- */
var answers=[],D=null,afterTimer=null;
function prompt(ph){slot.innerHTML='';var i=document.createElement('input');i.id='in';i.maxLength=200;i.placeholder=ph;i.setAttribute('aria-label',ph);slot.appendChild(i);line.classList.remove('off');i.focus({preventScroll:true});}

async function connect(){
  connected=true;busy=true;line.classList.add('off');
  [].forEach.call(feed.querySelectorAll('.row'),function(r){r.classList.add('world');});
  var h=local(TZ).h,isNight=(h>=22||h<6);PEOPLE=isNight?0:2+((Math.random()*2)|0);
  var awake=CREW.slice(0,isNight?8+((Math.random()*5)|0):3+((Math.random()*3)|0));if(awake.indexOf('review')<0)awake.push('review');
  AWAKE=awake.length;drawCrew(awake);crewEl.classList.add('on');
  await say('you','you','connect kaverne',30);
  await say('sys','kaverne','opening a line into the cave.',22);
  await say('sys','kaverne','it’s '+local(TZ).s+' in los angeles. '+awake.length+' agents awake, '+PEOPLE+(PEOPLE===1?' person.':' people.'),22);
  await say('ours','kaverne/review','→ you: what are you making?',15);
  busy=false;prompt('a sentence is plenty');
}
async function answer(text){
  answers.push(text);busy=true;line.classList.add('off');
  await say('you','you',text,60);
  if(answers.length>2){
    if(text){var r=rnd(D.crew.filter(function(x){return x!=='review';}));await say('ours','kaverne/review','→ '+r+': “'+frag(text)+'”. yours.',15);
      await say('ours','kaverne/'+r,rnd(['→ you: on it.','→ you: noted. trying it both ways.','→ you: good. that changes the first one.','→ you: yes. it was missing that.','→ review: doing it. showing you the difference later.']),16);}
    remember({s:frag(answers[0]),a:answers,d:D.id,t:Date.now()});
    busy=false;keepOpen();return;
  }
  if(answers.length===1){
    D=DOMAINS.filter(function(d){return d.k.test(text);})[0]||DEFAULT;
    var awake=D.crew.slice(0,Math.max(3,AWAKE));drawCrew(awake.concat(CREW.filter(function(r){return awake.indexOf(r)<0;})).slice(0,Math.max(awake.length,AWAKE)));
    var ls=D.first(frag(text));for(var i=0;i<ls.length;i++)await say('ours','kaverne/'+ls[i][0],ls[i][1],15);
    await say('ours','kaverne/'+D.ask[0],D.ask[1],15);
    busy=false;prompt('answer, or skip with enter');return;
  }
  /* the payoff: they show you something */
  var subj=subject(answers[0]),wish=colourWish(text);
  if(text)await say('ours','kaverne/review','→ everyone: noted: “'+frag(text)+'”.',15);
  await say('sys','kaverne','an hour passes, roughly.',26);
  for(var w=0;w<D.work.length;w++){var kind=D.work[w],wl=WORK_LINE[kind];
    var note=wl[1].replace('{s}',subj).replace('{wish}',wish.no.length?' no '+wish.no.join(', no ')+'. checked.':wish.yes.length?' built around the '+wish.yes[0]+'.':' the third one is doing the work.');
    await say('ours','kaverne/'+wl[0],note,16);
    if(kind==='marks')await show('kaverne/logo',marks(subj,answers[0]),true);
    if(kind==='specimen')await show('kaverne/type',specimen(subj),false);
    if(kind==='palette')await show('kaverne/colour',swatches(palette(answers.join(' '),wish)),false);
    if(kind==='boards')await show('kaverne/boards',boards(),true);
    if(kind==='wave')await show('kaverne/score',wave(answers.join(' ')),false);
    if(kind==='wire')await show('kaverne/design',wire(subj),true);
  }
  await say('ours','kaverne/review','→ you: rough, on purpose. we’ll keep going.',15);
  remember({s:frag(answers[0]),a:answers,d:D.id,t:Date.now()});
  busy=false;keepOpen();murmur(0);
}
function keepOpen(){prompt('say more, or just watch');}
/* after you stop talking, they keep going: a few more notes, then quiet */
function murmur(n){if(!D||n>=5||n*2>=D.after.length)return;afterTimer=setTimeout(async function(){if(document.hidden||busy){murmur(n);return;}
  var i=n*2,last=(n===4||(n+1)*2>=D.after.length);busy=true;await say('ours','kaverne/'+D.after[i],D.after[i+1],16);busy=false;
  if(last)await say('sys','kaverne','the line stays open. they’ll keep going without you.',22);
  murmur(n+1);},RM?6000:(15000+Math.random()*10000));}

$('go').addEventListener('click',connect);
line.addEventListener('submit',function(e){e.preventDefault();var i=$('in');if(!i||busy)return;var v=i.value.trim();if(!v&&answers.length===0)return;i.value='';answer(v);});
document.addEventListener('keydown',function(e){if(!connected&&e.key==='Enter'&&!e.metaKey){e.preventDefault();connect();}});

/* ---------- open mid-night; if you've been here, they say so ---------- */
(function seed(){for(var k=0;k<6;k++){var c=rnd(dark().length?dark():CITIES);row('',local(c[1]).s,c[0]).textContent=night();}
  var m=recall();showForget();
  if(m){var mins=Math.max(1,Math.round((Date.now()-m.t)/60000)),n=Math.min(400,Math.max(1,Math.round(mins/7)));
    var x=row('ours',local(TZ).s,'kaverne/review');x.textContent='→ you: welcome back. still on “'+m.s+'”. '+n+' more sketch'+(n===1?'':'es')+' since you left.';
    $('go').textContent='› pick the line back up';}
})();
world();
})();
</script>
