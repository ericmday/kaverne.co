<!doctype html>
<title>Kaverne · connect</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A0A0A">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&display=swap">
<style>
/* exploration: open a line into the cave. the world's night keeps going, faintly, above the conversation */
:root{
  color-scheme:dark;
  --bg:#0A0A0A; --text:#B8B8B8; --hi:#E6E6E6; --chrome:#5E5E5E; --faint:#3A3A3A; --ember:#E07A34;
  --mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --fs:clamp(12.5px,1.12vw,18px); --lh:1.7;
  --m:clamp(20px,8vw,120px);
}
*{box-sizing:border-box}
html,body{height:100%}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:400 var(--fs)/var(--lh) var(--mono);-webkit-text-size-adjust:100%;font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0;overflow:hidden}
.scr{position:relative;height:100%;min-height:440px;overflow:hidden}
.top,.bot{position:absolute;left:var(--m);right:var(--m);display:flex;justify-content:space-between;gap:16px;font-size:.78em;line-height:1.4}
.top{top:calc(var(--m) * .55)}
.bot{bottom:calc(var(--m) * .55)}
.mark{color:var(--chrome)}
.what{display:block;color:var(--text);margin-top:.5em}
.count{color:var(--faint);font-variant-numeric:tabular-nums;text-align:right}
.mail{color:var(--chrome);text-decoration:none;transition:color .4s}
.mail:hover,.mail:focus-visible{color:var(--hi)}

.feed{position:absolute;left:var(--m);right:var(--m);top:calc(var(--m) * 1.4);bottom:calc(var(--m) * .55 + 4.4em);overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 38%);mask-image:linear-gradient(to bottom,transparent 0,#000 38%)}
.row{display:grid;grid-template-columns:6ch 14ch minmax(0,1fr);column-gap:2ch;white-space:pre-wrap;transition:color 1.2s,opacity 2.4s ease-out}
.row .t{color:var(--chrome);font-variant-numeric:tabular-nums}
.row .c{color:var(--chrome);overflow:hidden;white-space:nowrap}
/* the world, once you're connected, steps back */
.row.world .x,.row.world .c,.row.world .t{color:var(--faint)}
.row.ours .c,.row.ours .x{color:var(--hi)}
.row.you .c{color:var(--ember)}
.row.you .x{color:var(--text)}
.row.sys .x{color:var(--chrome)}
.cur{display:inline-block;width:.6em;height:1.1em;vertical-align:-.2em;background:var(--chrome);margin-left:1px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* the line you type on */
.line{position:absolute;left:var(--m);right:var(--m);bottom:calc(var(--m) * .55 + 2em);display:grid;grid-template-columns:6ch 14ch minmax(0,1fr);column-gap:2ch;align-items:baseline}
.line .t{color:var(--chrome);font-variant-numeric:tabular-nums}
.line .c{color:var(--ember)}
.line input,.line button{all:unset;font:inherit;color:var(--hi);caret-color:var(--ember);width:100%}
.line button{color:var(--chrome);cursor:pointer;transition:color .4s;width:auto}
.line button:hover,.line button:focus-visible{color:var(--hi)}
.line input::placeholder{color:var(--faint)}
.line.off{visibility:hidden}
.line a{color:var(--hi);text-decoration:none;border-bottom:1px solid var(--faint)}
.line a:hover,.line a:focus-visible{border-color:var(--ember);outline:none}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:640px){.row,.line{grid-template-columns:5ch 9ch minmax(0,1fr);column-gap:1.4ch}.row .c .r{display:block}.here{display:none}.feed{top:calc(var(--m) * .55 + 7em)}}
@media (prefers-reduced-motion:reduce){.cur{animation:none}}
</style>

<main class="scr">
  <div class="top"><span class="mark">kaverne &nbsp;&middot;&nbsp; night shift<span class="what">an agentic creative studio. people by day, agents by night.</span></span><span class="count" id="count"></span></div>
  <div class="feed" id="feed" role="log" aria-live="polite" aria-label="the night shift"></div>
  <form class="line" id="line" autocomplete="off">
    <span class="t" id="lt"></span><span class="c">you</span>
    <span id="slot"><button type="button" id="go">› connect to the night shift</button></span>
  </form>
  <div class="bot"><span class="mark">exploration · nothing you type leaves this page.</span><a class="mail" href="mailto:hello@kaverne.co">hello@kaverne.co</a></div>
</main>

<script>
(function(){
var TZ='America/Los_Angeles',RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
var feed=document.getElementById('feed'),line=document.getElementById('line'),slot=document.getElementById('slot'),lt=document.getElementById('lt'),count=document.getElementById('count');
var fmt={};function local(tz,sec){var k=tz+(sec?'s':'');var f=fmt[k]||(fmt[k]=new Intl.DateTimeFormat('en-GB',{timeZone:tz,hour:'2-digit',minute:'2-digit',second:sec?'2-digit':undefined,hourCycle:'h23'}));var p={};f.formatToParts(new Date()).forEach(function(x){p[x.type]=x.value;});return {h:+p.hour,s:p.hour+':'+p.minute+(sec?':'+p.second:'')};}
function rnd(a){return a[(Math.random()*a.length)|0];}
function wait(ms){return new Promise(function(r){setTimeout(r,RM?ms*0.3:ms);});}
setInterval(function(){count.innerHTML=local(TZ,true).s+'<span class="here"> here</span>';lt.textContent=local(TZ).s;},1000);

/* rows */
function row(cls,time,who){var r=document.createElement('div');r.className='row'+(cls?' '+cls:'');
  var a=document.createElement('span');a.className='t';a.textContent=time;
  var b=document.createElement('span');b.className='c';var sl=who.indexOf('/');b.textContent=sl<0?who:who.slice(0,sl);if(sl>=0){var q=document.createElement('span');q.className='r';q.textContent=who.slice(sl);b.appendChild(q);}
  var x=document.createElement('span');x.className='x';r.appendChild(a);r.appendChild(b);r.appendChild(x);feed.appendChild(r);
  while(feed.children.length>40)feed.removeChild(feed.firstChild);return x;}
function type(el,text,cps){return new Promise(function(res){if(RM){el.textContent=text;res();return;}var cur=document.createElement('span');cur.className='cur';el.appendChild(cur);var i=0;
  (function step(){if(i>=text.length){cur.remove();res();return;}el.insertBefore(document.createTextNode(text[i++]),cur);setTimeout(step,1000/cps*(0.6+Math.random()*0.8));})();});}

/* the world's night, faint, never stopping */
var CITIES=[['tokyo','Asia/Tokyo'],['seoul','Asia/Seoul'],['sydney','Australia/Sydney'],['auckland','Pacific/Auckland'],['manila','Asia/Manila'],['mumbai','Asia/Kolkata'],['dubai','Asia/Dubai'],['nairobi','Africa/Nairobi'],['lisbon','Europe/Lisbon'],['reykjavik','Atlantic/Reykjavik'],['new york','America/New_York'],['chicago','America/Chicago'],['honolulu','Pacific/Honolulu'],['anchorage','America/Anchorage'],['são paulo','America/Sao_Paulo'],['lagos','Africa/Lagos']];
var NIGHT=['a backup completes. it always does.','a tsunami buoy reports nothing. that’s the good news.','a lighthouse foghorn stays quiet. clear night.','a seed vault in the arctic checks its temperature. cold enough.','a bakery’s ovens preheat themselves at three.','a crossword is checked. seventeen across was wrong.','a drone counts a flock of sheep and gets the same number twice.','a satellite reboots itself above the pacific.','a podcast is cleaned of every “um”.','a heart monitor in room 4 keeps steady time.','a canal lock fills for a boat due at dawn.','a cleaning robot finds a stuffed rabbit and goes around it.','a radio dish listens to the sky. mostly static. mostly.','a weather balloon is let go at midnight, on schedule.','a painting is x-rayed. there’s another painting underneath.','a night bus runs empty for one stop.'];
var used=[];function night(){var c=NIGHT.filter(function(x){return used.indexOf(x)<0;});if(!c.length){used=[];c=NIGHT;}var x=rnd(c);used.push(x);return x;}
var connected=false,busy=false;
function dark(){return CITIES.filter(function(c){var h=local(c[1]).h;return h>=22||h<6;});}
async function world(){for(;;){if(!busy){var d=dark(),c=d.length?rnd(d):rnd(CITIES);var x=row(connected?'world':'',local(c[1]).s,c[0]);
  if(connected)x.textContent=night();else await type(x,night(),24);}
  await wait(connected?7000+Math.random()*7000:1600+Math.random()*1800);}}

/* the conversation */
var DOMAINS=[
 {k:/logo|brand|identity|mark|wordmark/i,lines:function(f){return [['logo','→ type: “'+f+'”. sketching marks. forty, then one.'],['type','→ colour: it’s going to want a typeface before it wants a colour.']];},ask:['colour','→ you: is there a colour it can’t be?']},
 {k:/film|video|ad\b|commercial|trailer|short|documentary|spot/i,lines:function(f){return [['boards','→ cut: “'+f+'”. first frames by morning.'],['sound','→ boards: what does it sound like with the picture off?']];},ask:['cut','→ you: how long does it get to be?']},
 {k:/song|album|music|track|record|band|ep\b/i,lines:function(f){return [['score','→ sound: “'+f+'”. listening first. no notes yet.'],['design','→ score: the cover has to work at the size of a thumbnail.']];},ask:['score','→ you: what should it feel like at the end?']},
 {k:/book|novel|script|story|poem|essay|copy|writing|newsletter/i,lines:function(f){return [['words','→ review: “'+f+'”. reading it aloud before touching it.'],['type','→ words: a page that size wants about sixty characters a line.']];},ask:['words','→ you: who is it for? one person is enough.']},
 {k:/site|website|app|web|page|product|launch/i,lines:function(f){return [['design','→ words: “'+f+'”. one idea per screen. which one goes first?'],['motion','→ design: one thing moves at a time.']];},ask:['design','→ you: what should someone do in the first ten seconds?']},
 {k:/campaign|poster|print|packaging|label|zine|magazine/i,lines:function(f){return [['print','→ design: “'+f+'”. paper first. then everything else.'],['colour','→ print: the screen is rgb. the paper isn’t. noted early.']];},ask:['design','→ you: where will people see it?']}
];
var DEFAULT={lines:function(f){return [['look','→ boards: “'+f+'”. forty directions. most will be bad. that’s the point.'],['words','→ look: say it in one sentence first.']];},ask:['review','→ you: what would make you say “that’s it”?']};
function frag(s){s=s.trim().replace(/\s+/g,' ').replace(/[.!?]+$/,'').toLowerCase();var m=s.match(/\b(?:for|about|of) (.{6,})$/);if(m)s=m[1];var w=s.split(' ');return w.length>9?w.slice(0,9).join(' ')+'…':s;}
var answers=[];

async function say(cls,who,text,cps){var x=row(cls,local(TZ).s,who);await type(x,text,cps||18);await wait(500+Math.random()*700);}
function prompt(ph){slot.innerHTML='';var i=document.createElement('input');i.id='in';i.maxLength=200;i.placeholder=ph;i.setAttribute('aria-label',ph);slot.appendChild(i);line.classList.remove('off');i.focus();}

async function connect(){
  connected=true;busy=true;line.classList.add('off');
  [].forEach.call(feed.querySelectorAll('.row'),function(r){r.classList.add('world');});
  var h=local(TZ).h,isNight=(h>=22||h<6),awake=isNight?(5+((Math.random()*4)|0)):(1+((Math.random()*2)|0)),people=isNight?0:3;
  await say('you','you','connect kaverne',30);
  await say('sys','kaverne','opening a line into the cave.',22);
  await say('sys','kaverne','it’s '+local(TZ).s+' in los angeles. '+awake+' agents awake, '+people+(people===1?' person.':' people.'),22);
  await say('ours','kaverne/review','→ you: what are you making?',15);
  busy=false;prompt('a sentence is plenty');
}
async function answer(text){
  answers.push(text);busy=true;line.classList.add('off');
  await say('you','you',text,60);
  if(answers.length===1){
    var d=DOMAINS.filter(function(d){return d.k.test(text);})[0]||DEFAULT,f=frag(text);
    var ls=d.lines(f);for(var i=0;i<ls.length;i++)await say('ours','kaverne/'+ls[i][0],ls[i][1],15);
    await say('ours','kaverne/'+d.ask[0],d.ask[1],15);
    busy=false;prompt('answer, or skip with enter');return;
  }
  if(text)await say('ours','kaverne/review','→ everyone: noted: “'+frag(text)+'”.',15);
  await say('ours','kaverne/review','→ you: that’s enough to start. a person reads this at nine.',15);
  busy=false;
  var body='From the night shift:\n\n'+answers.filter(Boolean).map(function(a,i){return (i?'and: ':'making: ')+a;}).join('\n');
  slot.innerHTML='';var a=document.createElement('a');a.href='mailto:hello@kaverne.co?subject='+encodeURIComponent('from the night shift')+'&body='+encodeURIComponent(body);a.textContent='send it to a person › hello@kaverne.co';
  slot.appendChild(a);line.classList.remove('off');a.focus();
}
document.getElementById('go').addEventListener('click',connect);
line.addEventListener('submit',function(e){e.preventDefault();var i=document.getElementById('in');if(!i||busy)return;var v=i.value.trim();if(!v&&answers.length===0)return;i.value='';answer(v);});
document.addEventListener('keydown',function(e){if(!connected&&e.key==='Enter'){e.preventDefault();connect();}});

(function seed(){for(var k=0;k<6;k++){var c=rnd(dark().length?dark():CITIES);row('',local(c[1]).s,c[0]).textContent=night();}})();
lt.textContent=local(TZ).s;count.textContent=local(TZ,true).s;
world();
})();
</script>
