<!doctype html>
<title>Kaverne · strings</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A0A0A">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&display=swap">
<style>
/* exploration: open a line into the cave. everything the agents make is shown with the home page's own devices:
   the stream (your project becomes a long job), the cave wall (the work appears in letters, in firelight),
   the planet band (their night, your pin), the tally, and the drift (the cave starts seeing your project). */
:root{
  color-scheme:dark;
  --bg:#0A0A0A; --text:#B8B8B8; --hi:#E6E6E6; --chrome:#5E5E5E; --faint:#3A3A3A; --ember:#E07A34;
  --mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --fs:clamp(12.5px,1.12vw,18px); --lh:1.7;
  --m:clamp(20px,8vw,120px);
}
*{box-sizing:border-box}
html,body{height:100%}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:400 var(--fs)/var(--lh) var(--mono);-webkit-text-size-adjust:100%;font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0;overflow:hidden}
.scr{position:relative;height:100%;min-height:440px;overflow:hidden}
.glow{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.top,.bot{position:absolute;left:var(--m);right:var(--m);display:flex;justify-content:space-between;gap:16px;font-size:.78em;line-height:1.4}
.top{top:calc(var(--m) * .55)}
.bot{bottom:calc(var(--m) * .55)}
.mark{color:var(--chrome)}
.what{display:block;color:var(--text);margin-top:.5em}
.tally{display:block;color:var(--faint);font-variant-numeric:tabular-nums;margin-top:.5em}
.count{color:var(--faint);font-variant-numeric:tabular-nums;text-align:right}
.mail{color:var(--chrome);text-decoration:none;transition:color .4s}
.mail:hover,.mail:focus-visible{color:var(--hi);outline:none}
.forget{all:unset;font:inherit;color:var(--chrome);cursor:pointer;transition:color .4s}
.forget:hover,.forget:focus-visible{color:var(--hi)}

/* the crew: everyone awake, the speaker lit */
.crew{display:block;margin-top:.5em;color:var(--chrome);opacity:0;transition:opacity 2.4s}
.crew.on{opacity:1}
.crew i{font-style:normal;transition:color .6s}
.crew i.lit{color:var(--hi)}
.crew i.ppl{color:var(--chrome)}

.feed{position:absolute;left:var(--m);right:var(--m);top:calc(var(--m) * 1.4);bottom:calc(var(--m) * .55 + 6.6em);overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 34%);mask-image:linear-gradient(to bottom,transparent 0,#000 34%)}
.row{display:grid;grid-template-columns:6ch 14ch minmax(0,1fr);column-gap:2ch;white-space:pre-wrap;transition:color 1.2s,opacity 2.4s ease-out}
.row .t{color:var(--chrome);font-variant-numeric:tabular-nums}
.row .c{color:var(--chrome);overflow:hidden;white-space:nowrap}
.row.world .x,.row.world .c,.row.world .t{color:var(--faint)}
.row.ours .c,.row.ours .x{color:var(--hi)}
.row.job .c{color:var(--hi)}
.row.job .x{color:var(--text)}
.row.you .c{color:var(--ember)}
.row.you .x{color:var(--text)}
.row.sys .x{color:var(--chrome)}
.row.drift .x{color:var(--text);font-style:italic}
.row.drift .c{color:var(--faint)}
.cur{display:inline-block;width:.6em;height:1.1em;vertical-align:-.2em;background:var(--chrome);margin-left:1px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* one line of planet: where it is night right now; kaverne's pin and yours */
.band{position:absolute;left:var(--m);right:var(--m);bottom:calc(var(--m) * .55 + 4.1em);height:1.6em}
.band .cells{position:absolute;left:0;right:0;top:0;height:3px;display:flex;gap:2px}
.band .cells i{flex:1 1 0;background:var(--faint);opacity:.35;transition:opacity 4s,background 4s}
.band .cells i.n{background:var(--text);opacity:.55}
.band .pin{position:absolute;top:-6px;width:1px;height:15px;background:var(--ember)}
.band .pin.you{background:var(--text);opacity:0;transition:opacity 2.4s}
.band .pin.you.on{opacity:1}
.band .lab{position:absolute;top:14px;font-size:.72em;color:var(--chrome);white-space:nowrap;font-variant-numeric:tabular-nums}
.band .lab b{font-weight:400;color:var(--hi)}
.band .lab.you{opacity:0;transition:opacity 2.4s}
.band .lab.you.on{opacity:1}

/* the lanes: you on the left, the desk on the right, one lane per agent. the stream moves down to make room */
.lanes{position:absolute;left:var(--m);width:calc(100% - 2 * var(--m));top:calc(var(--m) * .55 + 6.4em);height:30vh;opacity:0;transition:opacity 2.4s;pointer-events:none;touch-action:none;cursor:crosshair}
.scr.linked .lanes{pointer-events:auto}
.scr.linked .lanes{opacity:1}
.crew{display:none!important}
.feed{transition:top 1.8s ease}
.scr.linked .feed{top:calc(var(--m) * .55 + 6.8em + 30vh)}

/* the line you type on */
.line{position:absolute;left:var(--m);right:var(--m);bottom:calc(var(--m) * .55 + 1.9em);display:grid;grid-template-columns:6ch 14ch minmax(0,1fr);column-gap:2ch;align-items:baseline}
.line .t{color:var(--chrome);font-variant-numeric:tabular-nums}
.line .c{color:var(--ember)}
.line input,.line button{all:unset;font:inherit;color:var(--hi);caret-color:var(--ember);width:100%}
.line button{color:var(--chrome);cursor:pointer;transition:color .4s;width:auto}
.line button:hover,.line button:focus-visible{color:var(--hi)}
.line input::placeholder{color:var(--faint)}
.line.off{visibility:hidden}

@media (max-width:640px){
  .lanes{top:calc(var(--m) * .55 + 7.4em);height:26vh}
  .scr.linked .feed{top:calc(var(--m) * .55 + 7.8em + 26vh)}
  .row,.line{grid-template-columns:5ch 9ch minmax(0,1fr);column-gap:1.4ch}
  .row .c .r{display:block}.here{display:none}
  .feed{top:calc(var(--m) * .55 + 9.5em);bottom:calc(var(--m) * .55 + 8.6em)}
  .band{bottom:calc(var(--m) * .55 + 5.9em)}
  .line{bottom:calc(var(--m) * .55 + 3.4em)}
  .crew{max-width:24ch;margin-left:auto}
}
@media (prefers-reduced-motion:reduce){.cur{animation:none}.crew,.row,.band .pin.you,.band .lab.you{transition:none}}
</style>

<main class="scr">
  <canvas class="glow" id="glow" aria-hidden="true"></canvas>
  <div class="top"><span class="mark">kaverne &nbsp;&middot;&nbsp; night shift<span class="what">an agentic creative studio. people by day, agents by night.</span><span class="tally" id="tally"></span></span><span class="count"><span id="count"></span><span class="crew" id="crew" aria-hidden="true"></span></span></div>
  <canvas class="lanes" id="lanes" aria-hidden="true"></canvas>
  <div class="feed" id="feed" role="log" aria-live="polite" aria-label="the night shift"></div>
  <div class="band" id="band" aria-hidden="true"><div class="cells" id="cells"></div></div>
  <form class="line" id="line" autocomplete="off">
    <span class="t" id="lt"></span><span class="c">you</span>
    <span id="slot"><button type="button" id="go">› connect to the night shift</button></span>
  </form>
  <div class="bot"><span class="mark">nothing you type leaves this page. · <button class="forget" id="snd">sound off</button><span id="mem"></span></span><a class="mail" href="mailto:hello@kaverne.co">hello@kaverne.co</a></div>
</main>

<script>
(function(){
var TZ='America/Los_Angeles',HOMELON=-118,RM=matchMedia('(prefers-reduced-motion: reduce)').matches,KEY='kaverne.line';
var $=function(id){return document.getElementById(id);};
var feed=$('feed'),line=$('line'),slot=$('slot'),lt=$('lt'),count=$('count'),crewEl=$('crew'),mem=$('mem'),tallyEl=$('tally'),band=$('band'),cells=$('cells');
var fmt={};function local(tz,sec){var k=tz+(sec?'s':'');var f=fmt[k]||(fmt[k]=new Intl.DateTimeFormat('en-GB',{timeZone:tz,hour:'2-digit',minute:'2-digit',second:sec?'2-digit':undefined,hourCycle:'h23'}));var p={};f.formatToParts(new Date()).forEach(function(x){p[x.type]=x.value;});return {h:+p.hour,s:p.hour+':'+p.minute+(sec?':'+p.second:'')};}
function rnd(a){return a[(Math.random()*a.length)|0];}
function wait(ms){return new Promise(function(r){setTimeout(r,RM?ms*0.3:ms);});}
function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function isNight(h){return h>=22||h<6;}

/* ---------- rows ---------- */
function row(cls,time,who){var r=document.createElement('div');r.className='row'+(cls?' '+cls:'');
  var a=document.createElement('span');a.className='t';a.textContent=time;
  var b=document.createElement('span');b.className='c';var sl=who.indexOf('/');b.textContent=sl<0?who:who.slice(0,sl);if(sl>=0){var q=document.createElement('span');q.className='r';q.textContent=who.slice(sl);b.appendChild(q);}
  var x=document.createElement('span');x.className='x';r.appendChild(a);r.appendChild(b);r.appendChild(x);feed.appendChild(r);
  while(feed.children.length>48)feed.removeChild(feed.firstChild);return x;}
function type(el,text,cps){return new Promise(function(res){if(RM){el.textContent=text;res();return;}var cur=document.createElement('span');cur.className='cur';el.appendChild(cur);var i=0;
  (function step(){if(i>=text.length){cur.remove();res();return;}el.insertBefore(document.createTextNode(text[i++]),cur);setTimeout(step,1000/cps*(0.6+Math.random()*0.8));})();});}

/* ---------- the planet band: where it's night; kaverne's pin and yours ---------- */
var N=72;for(var ci=0;ci<N;ci++)cells.appendChild(document.createElement('i'));
var YOULON=Math.max(-179,Math.min(179,-new Date().getTimezoneOffset()/4));
function lonX(l){return (l+180)/360;}
function mk(cls){var e=document.createElement('span');e.className=cls;band.appendChild(e);return e;}
var pinK=mk('pin'),pinY=mk('pin you'),labK=mk('lab'),labY=mk('lab you');
function place(lab,x,bw){var lw=lab.offsetWidth;lab.style.left=Math.max(0,Math.min(bw-lw,x-lw/2))+'px';}
function drawBand(){var d=new Date(),utc=d.getUTCHours()+d.getUTCMinutes()/60;
  [].forEach.call(cells.children,function(c,i){var lon=-180+(i+0.5)*360/N,solar=(utc+lon/15+48)%24;c.className=(solar<5.5||solar>=19.5)?'n':'';});
  var bw=band.clientWidth,xk=lonX(HOMELON)*bw,xy=lonX(YOULON)*bw,yh=d.getHours();
  pinK.style.left=xk+'px';pinY.style.left=xy+'px';
  var same=Math.abs(xk-xy)<bw*0.06;
  labK.innerHTML='kaverne'+(isNight(local(TZ).h)?' · night':' · day')+(P0?'  <b>'+Math.round(jobProgress()*100)+'%</b>':'')+(same&&connected?' · you':'');
  labY.textContent=same?'':'you'+(isNight(yh)?' · night':' · day');
  place(labK,xk,bw);if(!same){place(labY,xy,bw);
    /* if the two labels collide, put yours on the other side of its pin */
    var a=labK.getBoundingClientRect(),b=labY.getBoundingClientRect();if(a.right>b.left&&b.right>a.left){labY.style.left=(xy<xk?Math.max(0,xy-labY.offsetWidth-4):Math.min(bw-labY.offsetWidth,xy+4))+'px';}}
}
function tick(){count.innerHTML=local(TZ,true).s+'<span class="here"> here</span>';lt.textContent=local(TZ).s;
  var d=new Date(),sec=d.getUTCHours()*3600+d.getUTCMinutes()*60+d.getUTCSeconds();
  tallyEl.textContent=P0?Math.floor((Date.now()-P0)/1000*1.7+3).toLocaleString('en-US')+' things done on yours':Math.floor(sec*38.6).toLocaleString('en-US')+' things done tonight';
  drawBand();}

/* ---------- the cave wall: shapes made of letters, in firelight ---------- */
var glow=$('glow'),gx=glow.getContext('2d'),GW=0,GH=0,GFS=14,V=[];
function sizeGlow(){var r=glow.getBoundingClientRect(),d=Math.min(2,window.devicePixelRatio||1);GW=r.width;GH=r.height;glow.width=Math.round(GW*d);glow.height=Math.round(GH*d);gx.setTransform(d,0,0,d,0,0);GFS=Math.max(7,parseFloat(getComputedStyle(document.body).fontSize)*0.7);}
window.addEventListener('resize',function(){sizeGlow();drawBand();});sizeGlow();
function fromDraw(c,r,draw){var cv=document.createElement('canvas');cv.width=c;cv.height=r;var g=cv.getContext('2d');g.fillStyle='#fff';g.strokeStyle='#fff';g.scale(1,0.6);draw(g,c,r/0.6);var d=g.getImageData(0,0,c,r).data;return {c:c,r:r,v:function(x,y){return d[(y*c+x)*4+3]/255;}};}
function scaled(m,k){var c=Math.max(4,Math.round(m.c*k)),r=Math.max(3,Math.round(m.r*k));return {c:c,r:r,v:function(x,y){var fx=x/k,fy=y/k,x0=Math.min(m.c-1,Math.floor(fx)),y0=Math.min(m.r-1,Math.floor(fy)),x1=Math.min(m.c-1,x0+1),y1=Math.min(m.r-1,y0+1),tx=fx-x0,ty=fy-y0;
  return (m.v(x0,y0)*(1-tx)+m.v(x1,y0)*tx)*(1-ty)+(m.v(x0,y1)*(1-tx)+m.v(x1,y1)*tx)*ty;}};}
function hash2(x,y){var h=Math.sin(x*127.1+y*311.7)*43758.5453;return h-Math.floor(h);}
/* the work, as masks */
var WALL={
  mark:function(ch){return fromDraw(30,20,function(g,w,h){g.lineWidth=h*0.07;g.beginPath();g.arc(w/2,h/2,h*0.42,0,7);g.stroke();g.font='700 '+h*0.5+'px Georgia, serif';g.textAlign='center';g.textBaseline='middle';g.fillText(ch,w/2,h*0.53);});},
  mono:function(t){return fromDraw(36,18,function(g,w,h){g.lineWidth=h*0.06;g.strokeRect(w*0.12,h*0.12,w*0.76,h*0.76);g.font='700 '+h*0.42+'px "Helvetica Neue", Arial, sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(t.toUpperCase(),w/2,h*0.53,w*0.66);});},
  word:function(wd){var c=Math.min(70,wd.length*8+4);return fromDraw(c,11,function(g,w,h){g.font='900 '+h*0.9+'px "Helvetica Neue", Arial, sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(wd.toUpperCase(),w/2,h*0.54,w*0.96);});},
  serif:function(wd){var c=Math.min(70,wd.length*8+4);return fromDraw(c,12,function(g,w,h){g.font='italic 400 '+h*0.85+'px Georgia, serif';g.textAlign='center';g.textBaseline='middle';g.fillText(wd,w/2,h*0.55,w*0.96);});},
  frame:function(k){return fromDraw(44,20,function(g,w,h){g.lineWidth=h*0.05;g.strokeRect(w*0.04,h*0.06,w*0.92,h*0.88);
    if(k===0){g.fillRect(w*0.04,h*0.56,w*0.92,h*0.04);g.beginPath();g.arc(w*0.5,h*0.74,h*0.05,0,7);g.fill();}
    if(k===1){g.beginPath();g.arc(w*0.5,h*0.32,h*0.11,0,7);g.fill();g.fillRect(w*0.42,h*0.46,w*0.16,h*0.48);}
    if(k===2){g.beginPath();g.arc(w*0.18,h*0.26,h*0.06,0,7);g.fill();g.fillRect(w*0.56,h*0.72,w*0.3,h*0.06);}});},
  wave:function(seed){return fromDraw(60,16,function(g,w,h){var hh=hash(seed);for(var i=0;i<30;i++){var t=i/29,env=Math.sin(Math.PI*Math.min(1,t*1.3))*(t>.7?1:.5);hh=Math.imul(hh^(hh>>>15),2246822507)>>>0;var v=Math.max(0.08,env*(.55+(hh%100)/220));g.fillRect(w*(0.03+i*0.032),h*(0.9-0.8*v),w*0.02,h*0.8*v);}});},
  screen:function(){return fromDraw(44,24,function(g,w,h){g.lineWidth=h*0.04;g.strokeRect(w*0.04,h*0.05,w*0.92,h*0.9);g.fillRect(w*0.1,h*0.14,w*0.16,h*0.06);g.fillRect(w*0.66,h*0.14,w*0.22,h*0.06);g.fillRect(w*0.12,h*0.36,w*0.56,h*0.16);g.fillRect(w*0.12,h*0.58,w*0.36,h*0.05);g.strokeRect(w*0.12,h*0.72,w*0.22,h*0.1);});}
};
function spawn(m,letters,tint){if(!m||!GW)return;if(V.length>=4)V.shift();
  var now=performance.now(),cw=GFS*0.6,lh=GFS,mx=Math.max(16,GW*0.06),tw=GW*(GW<700?0.62+Math.random()*0.2:0.28+Math.random()*0.14);
  m=scaled(m,Math.min(tw/(m.c*cw),(GH*0.42)/(m.r*lh)));var w=m.c*cw,h=m.r*lh,best=null,bd=-1;
  for(var tr=0;tr<10;tr++){var px=mx+Math.random()*Math.max(1,GW-w-2*mx),py=GH*0.08+Math.random()*Math.max(1,GH*0.5-h),cx=px+w/2,cy=py+h/2,dmin=1e9;
    V.forEach(function(o){dmin=Math.min(dmin,Math.hypot(cx-(o.x0+o.m.c*cw/2),cy-(o.y0+o.m.r*lh/2)));});if(dmin>bd){bd=dmin;best=[px,py];}}
  V.push({m:m,letters:(letters||'kaverne').replace(/\s+/g,''),x0:best[0],y0:best[1],t0:now,peak:0.12+Math.random()*0.05,ph:Math.random()*9,IN:3600,HOLD:10000+Math.random()*4000,OUT:6000,tint:tint||null});}
function drawGlow(now){gx.clearRect(0,0,GW,GH);
  if(V.length){gx.font=GFS+'px "JetBrains Mono", ui-monospace, monospace';gx.textBaseline='top';var cw=GFS*0.6,lh=GFS;
    V=V.filter(function(v){var t=now-v.t0,env=t<v.IN?t/v.IN:t<v.IN+v.HOLD?1:1-(t-v.IN-v.HOLD)/v.OUT;if(env<=0)return false;env=env*env*(3-2*env);
      var s=t/1000,fl=RM?1:0.8+0.1*Math.sin(s*5.3+v.ph)+0.07*Math.sin(s*11.9+v.ph*2)+0.05*Math.sin(s*23.1)+0.05*(Math.random()-0.5);
      var step=RM?0:Math.floor(s*7),m=v.m,k=0,L=v.letters.length||1;
      for(var y=0;y<m.r;y++)for(var x=0;x<m.c;x++){var d=m.v(x,y);if(d<0.18)continue;
        var dx=(x/(m.c-1)-0.5)*2,dy=(y/(m.r-1)-0.5)*2,fe=Math.max(0,1-Math.sqrt(dx*dx*0.7+dy*dy*0.7));fe=Math.min(1,fe*1.9);fe=fe*fe*(3-2*fe);
        var a=v.peak*env*fl*fe*(0.45+0.55*d)*(0.78+0.22*hash2(x+step*7,y+v.ph));var ch=v.letters[k++%L];if(a<0.004)continue;
        var q=Math.min(1,d*fe*1.15),rr=200+55*q,gg=52+160*q*q,bb=28+120*q*q*q;
        if(v.tint){rr=rr*0.45+v.tint[0]*0.55;gg=gg*0.45+v.tint[1]*0.55;bb=bb*0.45+v.tint[2]*0.55;}
        gx.fillStyle='rgba('+Math.round(rr)+','+Math.round(gg)+','+Math.round(bb)+','+a.toFixed(3)+')';gx.fillText(ch,v.x0+x*cw,v.y0+y*lh);}
      return true;});}
  requestAnimationFrame(drawGlow);}
requestAnimationFrame(drawGlow);

/* ---------- strings: every agent is a string from you, over its peg, to the desk.
   speaking plucks it; the line rides along it; handoffs set the other string humming and tie a thread between them.
   the threads stay: by morning they're a cradle, the night's record. you can strum them. ---------- */
var lc=$('lanes'),lx=lc.getContext('2d'),LW=0,LH=0,LANES=[],KNOTS=[],THREADS=[],BEADS=[],lanesOn=false,lanesT0=0,SOUND=false,AC=null,lastReply=0,replied={};
function sizeLanes(){var r=lc.getBoundingClientRect(),d=Math.min(2,window.devicePixelRatio||1);LW=r.width;LH=r.height;lc.width=Math.round(LW*d);lc.height=Math.round(LH*d);lx.setTransform(d,0,0,d,0,0);}
window.addEventListener('resize',sizeLanes);
function laneI(r){for(var i=0;i<LANES.length;i++)if(LANES[i].r===r)return i;return -1;}
function you(){return [LW*0.045,LH*0.46];}function desk(){return [LW*0.955,LH*0.46];}
function peg(i){var n=LANES.length,y=n>1?LH*0.07+(LH*0.8)*(i/(n-1)):LH*0.46;return [LW*0.5,y];}
/* a string is two straight runs: you → peg, peg → desk. each run vibrates on its own */
function run(i,k){return k?[peg(i),desk()]:[you(),peg(i)];}
function setLanes(roles){var old={};LANES.forEach(function(l){old[l.r]=l;});
  LANES=roles.slice(0,8).map(function(r){return old[r]||{r:r,lit:-1e9,pl:[[],[]],say:null};});
  LANES.forEach(function(l,i){l.f=1.9+i*0.17;l.note=[1,9/8,5/4,3/2,5/3,2,9/4,5/2][(LANES.length-1-i)%8];});
  if(!lanesOn){lanesOn=true;lanesT0=performance.now();document.querySelector('.scr').classList.add('linked');setTimeout(sizeLanes,60);}}

var DEFAULT={id:'any',crew:['look','boards','words','colour','review'],
  first:function(f){return [['look','→ boards: “'+f+'”. forty directions. most will be bad. that’s the point.'],['words','→ look: say it in one sentence first.']];},ask:['review','→ you: what would make you say “that’s it”?'],
  show:[['boards','→ you: three directions. on the wall.','frames']],
  job:{role:'look',t:'{s}: direction {n} of {max}.',a:' one of them is strange.',max:40,done:'{s}: forty directions. the strange one is still here.'},
  after:['look','→ review: six directions. one is strange. keeping it.','boards','→ look: frame 3 has the light.','colour','→ look: warm highlights, cool shadows.','review','→ everyone: the safe one is in the folder. so is the one we’d make.']};
function domainById(id){return DOMAINS.filter(function(d){return d.id===id;})[0]||DEFAULT;}

/* ---------- the project: answers, the work on the wall, the long job ---------- */
var ANSWERS=[],D=null,SUBJ='',TINT=null,WORK=[],P0=0,jobSeen=false,jobDone=false,noteI=0;
function buildWork(){var sub=SUBJ,ini=initials(ANSWERS[0]||sub),out=[];
  D.show.forEach(function(s){var k=s[2];
    if(k==='marks'){out.push(function(){return WALL.mark(sub[0]);},function(){return WALL.mono(ini);},function(){return WALL.serif(sub);});}
    if(k==='type'){out.push(function(){return WALL.word(sub);},function(){return WALL.serif(sub);});}
    if(k==='frames'){out.push(function(){return WALL.frame(0);},function(){return WALL.frame(1);},function(){return WALL.frame(2);});}
    if(k==='wave'){out.push(function(){return WALL.wave(ANSWERS.join(' '));});}
    if(k==='screen'){out.push(function(){return WALL.screen();});}});
  WORK=out;}
function jobProgress(){return P0?Math.min(1,(Date.now()-P0)/(RM?120000:360000)):0;}
function jobLine(){var j=D.job,n=Math.max(1,Math.min(j.max,Math.ceil(jobProgress()*j.max)));
  if(n>=j.max){jobDone=true;return j.done.replace('{s}',SUBJ);}
  var t=j.t.replace('{s}',SUBJ).replace('{n}',n).replace('{max}',j.max)+(jobSeen?'':j.a);jobSeen=true;return t;}
var DRIFT=['something like a {s} on the far wall. there’s no {s}.','the drip sounds like someone saying “{s}”.','for a moment the wall looks like your {k}.','a shape, high up on the left. it might be ours.','the water sounds like a room full of people agreeing.'];
function driftLine(){var kind={logo:'logo',film:'film',music:'record',words:'book',site:'site',print:'poster',any:'idea'}[D.id];return rnd(DRIFT).replace(/\{s\}/g,SUBJ).replace('{k}',kind);}

/* ---------- memory: only in this browser ---------- */
function recall(){try{var m=JSON.parse(localStorage.getItem(KEY)||'null');if(m&&m.a&&Date.now()-m.t<7*864e5)return m;}catch(e){}return null;}
function remember(){try{localStorage.setItem(KEY,JSON.stringify({a:ANSWERS,d:D.id,t:Date.now(),p0:P0}));}catch(e){}showForget();}
function showForget(){mem.innerHTML=recall()?' · <button class="forget" id="fg">forget me</button>':'';var b=$('fg');if(b)b.onclick=function(){try{localStorage.removeItem(KEY);}catch(e){}mem.textContent=' · forgotten.';};}

/* ---------- the conversation ---------- */
async function say(cls,who,text,cps){if(who.indexOf('kaverne/')===0){lit(who.slice(8));laneEvent(who,text);}var x=row(cls,local(TZ).s,who);await type(x,text,cps||18);await wait(500+Math.random()*700);}
function prompt(ph){slot.innerHTML='';var i=document.createElement('input');i.id='in';i.maxLength=200;i.placeholder=ph;i.setAttribute('aria-label',ph);slot.appendChild(i);line.classList.remove('off');i.focus({preventScroll:true});}

async function connect(){
  connected=true;connectedAt=Date.now();busy=true;line.classList.add('off');
  [].forEach.call(feed.querySelectorAll('.row'),function(r){r.classList.add('world');});
  var nt=isNight(local(TZ).h);PEOPLE=nt?0:2+((Math.random()*2)|0);
  var awake=CREW.slice(0,nt?8+((Math.random()*5)|0):3+((Math.random()*3)|0));if(awake.indexOf('review')<0)awake.push('review');
  AWAKE=awake.length;drawCrew(awake);crewEl.classList.add('on');pinY.classList.add('on');labY.classList.add('on');drawBand();
  await say('you','you','connect kaverne',30);
  await say('sys','kaverne','opening a line into the cave.',22);
  await say('sys','kaverne','it’s '+local(TZ).s+' in los angeles. '+AWAKE+' agents awake, '+PEOPLE+(PEOPLE===1?' person.':' people.'),22);
  if(D){/* back again: pick it up where it is */
    await say('ours','kaverne/review','→ you: still on “'+frag(ANSWERS[0])+'”. it’s further along.',15);
    await say('job','kaverne/'+D.job.role,jobLine(),18);
    if(WORK.length)spawn(rnd(WORK)(),ANSWERS.join(' '),TINT);
    busy=false;prompt('say more, or just watch');work();return;}
  await say('ours','kaverne/review','→ you: what are you making?',15);
  busy=false;prompt('a sentence is plenty');
}
async function answer(text){
  busy=true;line.classList.add('off');
  laneYou();await say('you','you',text,60);
  if(ANSWERS.length>=2){/* anything after the work goes to the crew */
    if(text){ANSWERS.push(text);var r=rnd(D.crew.filter(function(x){return x!=='review';}));
      await say('ours','kaverne/review','→ '+r+': “'+frag(text)+'”. yours.',15);
      await say('ours','kaverne/'+r,rnd(['→ you: on it.','→ you: noted. trying it both ways.','→ you: good. that changes the first one.','→ you: yes. it was missing that.']),16);
      remember();}
    busy=false;prompt('say more, or just watch');return;}
  ANSWERS.push(text);
  if(ANSWERS.length===1){
    D=DOMAINS.filter(function(d){return d.k.test(text);})[0]||DEFAULT;SUBJ=subject(text);
    var awake=D.crew.slice(0,Math.max(3,AWAKE));drawCrew(awake.concat(CREW.filter(function(r){return awake.indexOf(r)<0;})).slice(0,Math.max(awake.length,AWAKE)));
    var ls=D.first(frag(text));for(var i=0;i<ls.length;i++)await say('ours','kaverne/'+ls[i][0],ls[i][1],15);
    await say('ours','kaverne/'+D.ask[0],D.ask[1],15);
    busy=false;prompt('answer, or skip with enter');return;}
  /* second answer: the colours, then the work appears on the wall */
  var wish=colourWish(text),pal=palette(ANSWERS.join(' '),wish);TINT=pal[2];
  if(text)await say('ours','kaverne/review','→ everyone: noted: “'+frag(text)+'”.',15);
  await say('sys','kaverne','an hour passes, roughly.',26);
  await say('ours','kaverne/colour','→ you: four colours. '+pal.map(hex).join(' ')+'.'+(wish.no.length?' no '+wish.no.join(', no ')+'. checked.':wish.yes.length?' built around the '+wish.yes[0]+'.':''),16);
  buildWork();var wi=0;
  for(var s=0;s<D.show.length;s++){var sh=D.show[s],n=sh[2]==='marks'||sh[2]==='frames'?3:sh[2]==='type'?2:1;
    await say('ours','kaverne/'+sh[0],sh[1].replace('{s}',SUBJ),16);
    for(var q=0;q<n&&wi<WORK.length;q++,wi++){spawn(WORK[wi](),ANSWERS.join(' '),TINT);await wait(1400);}}
  await say('ours','kaverne/review','→ you: rough, on purpose. press . to see it again. we’ll keep going.',15);
  P0=Date.now();remember();
  busy=false;prompt('say more, or just watch');work();
}
/* the night goes on: your project comes back as a long job, with notes in between */
var working=false;
function work(){if(working)return;working=true;var k=0;
  (async function loop(){for(;;){await wait(RM?7000:14000+Math.random()*10000);
    if(document.hidden||busy)continue;busy=true;
    if(!jobDone&&(k%2===0||noteI*2>=D.after.length)){await say('job','kaverne/'+D.job.role,jobLine(),18);if(jobDone&&WORK.length)spawn(WORK[0](),ANSWERS.join(' '),TINT);}
    else if(noteI*2<D.after.length){var i=noteI*2;noteI++;await say('ours','kaverne/'+D.after[i],D.after[i+1],16);}
    else{await say('sys','kaverne','the line stays open. they’ll keep going without you.',22);busy=false;working=false;return;}
    k++;busy=false;remember();}})();}

$('go').addEventListener('click',connect);
$('snd').addEventListener('click',function(){SOUND=!SOUND;this.textContent=SOUND?'sound on':'sound off';if(SOUND)tone(1.5,0.6);});
line.addEventListener('submit',function(e){e.preventDefault();var i=$('in');if(!i||busy)return;var v=i.value.trim();if(!v&&ANSWERS.length===0)return;i.value='';answer(v);});
document.addEventListener('keydown',function(e){
  if(!connected&&e.key==='Enter'&&!e.metaKey){e.preventDefault();connect();return;}
  /* . brings your work back to the wall; before that, it pulls a word from the stream */
  var typing=document.activeElement&&document.activeElement.tagName==='INPUT'&&document.activeElement.value!=='';
  if(e.key==='.'&&!e.metaKey&&!e.ctrlKey&&!typing){if(document.activeElement&&document.activeElement.tagName==='INPUT')e.preventDefault();
    if(WORK.length)spawn(rnd(WORK)(),ANSWERS.join(' '),TINT);
    else{var rows=feed.querySelectorAll('.row .x');if(rows.length){var t=rows[rows.length-1-((Math.random()*Math.min(4,rows.length))|0)].textContent,w=t.split(/\s+/).filter(function(x){return x.length>4;});if(w.length)spawn(WALL.word(rnd(w).replace(/[^a-z]/gi,'')),t);}}}
});

/* ---------- open mid-night; if you've been here, they say so ---------- */
(function seed(){for(var k=0;k<6;k++){var c=rnd(dark().length?dark():CITIES);row('',local(c[1]).s,c[0]).textContent=night();}
  var m=recall();showForget();
  if(m){ANSWERS=m.a;D=domainById(m.d);SUBJ=subject(ANSWERS[0]);P0=m.p0||m.t;jobSeen=true;var pal=palette(ANSWERS.slice(0,2).join(' '),colourWish(ANSWERS[1]||''));TINT=pal[2];buildWork();
    var x=row('ours',local(TZ).s,'kaverne/review'),pc=Math.round(jobProgress()*100);
    x.textContent='→ you: welcome back. “'+frag(ANSWERS[0])+'” is '+(pc>=100?'done for tonight.':pc+'% along.');
    $('go').textContent='› pick the line back up';setTimeout(function(){if(WORK.length)spawn(rnd(WORK)(),ANSWERS.join(' '),TINT);},2500);}
  tick();setInterval(tick,1000);
})();
world();
})();
</script>
